<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flores en 4 plantas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&display=swap">
<style>
/* Layout: una "pizarra" grande para proyectar; título del paso arriba, escena SVG al centro, controles abajo */
:root{
  --bg:#eef5f1; --board:#ffffff; --ink:#1f2a37; --soft:#5d6b78; --line:#c9d6d0; --grid:#e3ebe7;
  --accent:#d6336c; --petal:#e77fb3; --core:#f6c445; --stem:#3f9b5a; --pot:#b7653a;
  --a:#4caf50; --b:#f2c230; --c:#3fa4e0; --d:#f08a2c; --hl:#fff1a8;
  --display:"Baloo 2", "Comic Sans MS", system-ui, sans-serif;
  --body:"Andika", "Trebuchet MS", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141c1a; --board:#1d2826; --ink:#eef4f1; --soft:#a8b8b2; --line:#3a4a46; --grid:#2a3835;
  --accent:#ff6b9a; --petal:#f08cc0; --core:#f6c445; --stem:#5cc27a; --pot:#c97a4e; --hl:#5a4d10; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141c1a; --board:#1d2826; --ink:#eef4f1; --soft:#a8b8b2; --line:#3a4a46; --grid:#2a3835;
  --accent:#ff6b9a; --petal:#f08cc0; --core:#f6c445; --stem:#5cc27a; --pot:#c97a4e; --hl:#5a4d10; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;box-sizing:border-box}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:12px;min-height:100%}
header{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.step-n{font-family:var(--display);font-weight:800;color:var(--accent);font-size:clamp(28px,4vw,44px);line-height:1}
h1{font-family:var(--display);font-weight:800;font-size:clamp(26px,3.6vw,42px);margin:0;line-height:1.1;text-wrap:balance}
.say{font-size:clamp(19px,2.2vw,26px);margin:0;line-height:1.4;max-width:60ch}
.board{background:var(--board);border:2px solid var(--line);border-radius:18px;padding:8px;flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
svg{width:100%;height:auto;max-height:62vh;display:block}
svg text{font-family:var(--body);fill:var(--ink)}
.extra{display:flex;flex-wrap:wrap;gap:10px}
.extra:empty{display:none}
.q{font:inherit;font-size:clamp(17px,2vw,22px);padding:10px 16px;border-radius:12px;border:2px solid var(--line);background:var(--board);color:var(--ink);cursor:pointer}
.q[aria-pressed="true"]{border-color:var(--accent);background:var(--hl)}
nav{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.btn{font-family:var(--display);font-weight:800;font-size:22px;padding:8px 22px;border-radius:14px;border:0;cursor:pointer;background:var(--accent);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn:disabled{opacity:.35;cursor:default}
.btn:focus-visible,.q:focus-visible,.dot:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.dots{display:flex;gap:8px;margin:0 auto}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--accent);background:transparent;padding:0;cursor:pointer}
.dot.on{background:var(--accent)}
.hint{color:var(--soft);font-size:14px}

/* animaciones */
.pop{transform-box:fill-box;transform-origin:center;animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.fade{animation:fade .5s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow 1.1s cubic-bezier(.2,.8,.3,1) both}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.growx{transform-box:fill-box;transform-origin:0 50%;animation:growx 1.1s cubic-bezier(.2,.8,.3,1) both}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.draw{stroke-dasharray:1;animation:draw .3s ease-out both}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.dim{animation:dim .8s ease both}
@keyframes dim{from{opacity:1}to{opacity:.28}}
svg text.acc{fill:var(--accent)} svg text.wht{fill:#fff}
.faded{opacity:.25;transition:opacity .4s}
/* transiciones entre representaciones: cada elemento parte desde donde estaba en el paso anterior */
.move,.fly,.tip{transform-box:view-box;transform-origin:0 0}
.move{animation:move 1.3s cubic-bezier(.45,0,.2,1) both}
@keyframes move{from{transform:var(--from)}}
.fly{animation:fly .9s cubic-bezier(.45,0,.2,1) both}
@keyframes fly{0%{transform:var(--from);opacity:0}20%{transform:var(--from);opacity:1}}
.tip{transform-box:fill-box;transform-origin:0 50%;animation:move 1.5s cubic-bezier(.45,0,.2,1) both}
.out{animation:out .7s ease both}
@keyframes out{to{opacity:0}}
.spent{opacity:.28}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
</head>
<body>

<div class="wrap">
  <header><span class="step-n" id="num">1</span><h1 id="title"></h1></header>
  <p class="say" id="say"></p>
  <div class="board"><svg id="stage" viewBox="0 0 840 520" role="img" aria-labelledby="title"></svg></div>
  <div class="extra" id="extra"></div>
  <nav>
    <button class="btn ghost" id="prev">◀ Atrás</button>
    <div class="dots" id="dots"></div>
    <button class="btn ghost" id="again">↻ Repetir</button>
    <button class="btn" id="next">Siguiente ▶</button>
  </nav>
  <span class="hint">Tip para proyectar: usa las flechas ← → del teclado. La barra espaciadora repite la animación.</span>
</div>

<script>
const D=[{k:'A',n:1,c:'var(--a)'},{k:'B',n:7,c:'var(--b)'},{k:'C',n:5,c:'var(--c)'},{k:'D',n:3,c:'var(--d)'}];
const X0=150,Y0=430,U=44,BW=84,cx=i=>260+i*140,yv=v=>Y0-v*U;
const st=(d)=>`style="animation-delay:${d}s"`;

function flower(x,y,r,d,cls='pop',extra=''){
  const o=r*.55,pr=r*.52;
  return `<g class="${cls}" ${st(d)} ${extra}>
    ${[[0,-o],[o,0],[0,o],[-o,0]].map(([a,b])=>`<circle cx="${x+a}" cy="${y+b}" r="${pr}" fill="var(--petal)"/>`).join('')}
    <circle cx="${x}" cy="${y}" r="${r*.32}" fill="var(--core)"/></g>`;
}
function axes(anim,{scale=true,ttl='Flores en 4 plantas'}={}){
  const a=c=>anim?c:'';
  let s=`<text x="460" y="40" text-anchor="middle" font-size="28" font-weight="700" class="${a('fade')}">${ttl}</text>`;
  for(let v=1;v<=8;v++) s+=`<line x1="${X0}" x2="770" y1="${yv(v)}" y2="${yv(v)}" stroke="var(--grid)" stroke-width="2" class="${a('fade')}" ${st(anim?.2:0)}/>`;
  s+=`<line x1="${X0}" y1="${Y0}" x2="${X0}" y2="${yv(8)-14}" stroke="var(--ink)" stroke-width="4" stroke-linecap="round" pathLength="1" class="${a('draw')}" ${st(0)}/>`;
  s+=`<line x1="${X0}" y1="${Y0}" x2="780" y2="${Y0}" stroke="var(--ink)" stroke-width="4" stroke-linecap="round" pathLength="1" class="${a('draw')}" ${st(.2)}/>`;
  if(scale) for(let v=0;v<=8;v++) s+=`<text id="n${v}" x="${X0-20}" y="${yv(v)+8}" text-anchor="end" font-size="24" font-weight="700" class="${a('pop')}" ${st(anim?.4+v*.12:0)}>${v}</text>`;
  s+=`<text x="58" y="${(Y0+yv(8))/2}" transform="rotate(-90 58 ${(Y0+yv(8))/2})" text-anchor="middle" font-size="22" class="${a('fade')}">Número de flores</text>`;
  s+=`<text x="460" y="508" text-anchor="middle" font-size="22" class="${a('fade')}">Plantas</text>`;
  D.forEach((p,i)=>s+=`<text x="${cx(i)}" y="${Y0+34}" text-anchor="middle" font-size="28" font-weight="700">${p.k}</text>`);
  return s;
}
const bars=(anim,base=1.4)=>D.map((p,i)=>`<rect id="bar${i}" x="${cx(i)-BW/2}" y="${yv(p.n)}" width="${BW}" height="${p.n*U}" fill="${p.c}" stroke="var(--ink)" stroke-width="2" class="${anim?'grow':''}" ${st(base+i*.5)}/>`).join('');

const SPOTS=[[0,-150],[-38,-118],[38,-118],[-44,-74],[44,-74],[0,-96],[0,-44]];
// planta en coordenadas locales: el origen es el borde de la maceta
function plant(p,fl){
  let s=`<path d="M0 0 Q-6 -70 0 -140" stroke="var(--stem)" stroke-width="7" fill="none"/>`;
  s+=`<ellipse cx="-20" cy="-40" rx="18" ry="8" fill="var(--stem)" transform="rotate(-30 -20 -40)"/><ellipse cx="20" cy="-60" rx="18" ry="8" fill="var(--stem)" transform="rotate(30 20 -60)"/>`;
  s+=`<path d="M-45 0 h90 l-12 60 h-66z" fill="var(--pot)"/>`;
  s+=`<text x="0" y="40" text-anchor="middle" font-size="30" font-weight="700" class="wht">${p.k}</text>`;
  for(let j=0;j<p.n;j++){const [c,d]=fl(j);s+=flower(SPOTS[j][0],SPOTS[j][1],20,d,c);}
  return s;
}
// tabla de conteo (coordenadas del paso 2)
const TB={L:130,M:290,R:600,E:720,T:50,H:86};
const rowMy=r=>TB.T+TB.H*(r+1)+TB.H/2;
function mark(r,j){const my=rowMy(r),g=Math.floor(j/5),q=j%5,gx=TB.M+40+g*120;
  return q<4?{a:`x1="${gx+q*20}" x2="${gx+q*20}" y1="${my-26}" y2="${my+26}"`,x:gx+q*20,y:my}
            :{a:`x1="${gx-12}" x2="${gx+72}" y1="${my+20}" y2="${my-20}"`,x:gx+30,y:my};}
function tableFrame(){const {L,M,R,E,T,H}=TB;
  let s=`<rect x="${L}" y="${T}" width="${E-L}" height="${H*5}" rx="14" fill="none" stroke="var(--line)" stroke-width="3"/>`;
  s+=`<rect x="${L}" y="${T}" width="${E-L}" height="${H}" rx="14" fill="var(--accent)"/>`;
  [['Planta',(L+M)/2],['Conteo',(M+R)/2],['Total',(R+E)/2]].forEach(([w,x])=>s+=`<text x="${x}" y="${T+56}" text-anchor="middle" font-size="30" font-weight="700" class="wht">${w}</text>`);
  [M,R].forEach(x=>s+=`<line x1="${x}" x2="${x}" y1="${T}" y2="${T+H*5}" stroke="var(--line)" stroke-width="3"/>`);
  D.forEach((p,r)=>{const y=T+H*(r+1);s+=`<line x1="${L}" x2="${E}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="3"/>`;
    s+=`<text x="255" y="${rowMy(r)+12}" text-anchor="middle" font-size="34" font-weight="700">${p.k}</text>`;});
  return s;}
const PL_ROW=r=>`translate(185px,${rowMy(r)+18}px) scale(.32)`;
const MINI={x:-40,y:40,s:.45}; // tabla achicada en el paso 3
function tableDone(markExtra){let t=tableFrame();
  D.forEach((p,r)=>{t+=`<g style="transform:${PL_ROW(r)}">${plant(p,()=>['spent',0])}</g>`;
    for(let j=0;j<p.n;j++) t+=`<line ${mark(r,j).a} stroke="var(--ink)" stroke-width="5" stroke-linecap="round" ${markExtra(r,j)}/>`;
    t+=`<text x="${(TB.R+TB.E)/2}" y="${rowMy(r)+14}" text-anchor="middle" font-size="40" font-weight="700" class="acc">${p.n}</text>`;});
  return t;}
const KEY=(x=640)=>`${flower(x,82,16,0,'')}<text x="${x+24}" y="90" font-size="22">= 1 flor</text>`;

const steps=[
 {t:'Sofía contó las flores de 4 plantas',s:'¡Contemos juntos! ¿Cuántas flores tiene cada planta?',
  draw(){
   let s='';
   D.forEach((p,i)=>{const x=cx(i)-30;
     s+=`<g transform="translate(${x} 380)">${plant(p,j=>['pop',.4+i*1.6+j*.2])}</g>`;
     s+=`<text x="${x}" y="80" text-anchor="middle" font-size="44" font-weight="700" class="acc pop" ${st(.6+i*1.6+p.n*.2)}>${p.n}</text>`;
   });
   return s;}},
 {t:'Lo anota en una tabla de conteo',s:'Las plantas se ordenan en la tabla. Por cada flor que contamos, hacemos un palito. Al llegar a 5, cruzamos el grupo.',
  draw(){
   // delays: cada flor se "gasta" justo cuando se dibuja su palito
   const dl=[];let d=2;
   D.forEach((p,r)=>{dl[r]=[];for(let j=0;j<p.n;j++){dl[r][j]=d;d+=.4;}dl[r].tot=d;d+=.5;});
   let s='';
   D.forEach((p,i)=>s+=`<text x="${cx(i)-30}" y="80" text-anchor="middle" font-size="44" font-weight="700" class="acc out" ${st(.1)}>${p.n}</text>`);
   s+=`<g class="fade" ${st(1.1)}>${tableFrame()}</g>`;
   D.forEach((p,r)=>{
     s+=`<g class="move" style="transform:${PL_ROW(r)};--from:translate(${cx(r)-30}px,380px) scale(1);animation-delay:${r*.12}s">${plant(p,j=>['dim',dl[r][j]])}</g>`;
     for(let j=0;j<p.n;j++) s+=`<line ${mark(r,j).a} stroke="var(--ink)" stroke-width="5" stroke-linecap="round" pathLength="1" class="draw" ${st(dl[r][j])}/>`;
     s+=`<text x="${(TB.R+TB.E)/2}" y="${rowMy(r)+14}" text-anchor="middle" font-size="40" font-weight="700" class="acc pop" ${st(dl[r].tot)}>${p.n}</text>`;
   });
   return s;}},
 {t:'Lo muestra en un pictograma',s:'Cada palito de la tabla se convierte en una flor. Las ponemos una encima de otra: cada flor dibujada representa 1 flor.',
  draw(){
   const dl=[];let d=2;
   D.forEach((p,r)=>{dl[r]=[];for(let j=0;j<p.n;j++){dl[r][j]=d;d+=.3;}d+=.3;});
   const t=tableDone((r,j)=>`class="dim" ${st(dl[r][j])}`);
   let s=`<g class="move" style="transform:translate(${MINI.x}px,${MINI.y}px) scale(${MINI.s});--from:translate(0px,0px) scale(1);animation-delay:.4s">${t}</g>`;
   s+=`<g class="fade" ${st(1.5)}><text x="460" y="40" text-anchor="middle" font-size="28" font-weight="700">Flores en 4 plantas</text>
     <line x1="${X0}" y1="${Y0}" x2="780" y2="${Y0}" stroke="var(--ink)" stroke-width="4"/>
     ${D.map((p,i)=>`<text x="${cx(i)}" y="${Y0+34}" text-anchor="middle" font-size="28" font-weight="700">${p.k}</text>`).join('')}</g>`;
   D.forEach((p,r)=>{for(let j=0;j<p.n;j++){const m=mark(r,j),sx=MINI.x+m.x*MINI.s,sy=MINI.y+m.y*MINI.s;
     s+=`<g class="fly" style="transform:translate(${cx(r)}px,${yv(j+.5)}px);--from:translate(${sx}px,${sy}px) scale(.45);animation-delay:${dl[r][j]}s">${flower(0,0,19,0,'')}</g>`;}});
   s+=`<g class="fade" ${st(d+.2)}>${KEY()}</g>`;
   return s;}},
 {t:'¡Ahora un gráfico de barras!',s:'Las mismas flores quedan dentro de una barra: la barra sube hasta donde llegan las flores. Los números del costado forman la escala.',
  draw(){
   let s=`<g class="out" ${st(.3)}><g style="transform:translate(${MINI.x}px,${MINI.y}px) scale(${MINI.s})">${tableDone(()=>'class="spent"')}</g>${KEY()}</g>`;
   s+=axes(true)+bars(true,1.8);
   D.forEach((p,i)=>{for(let j=0;j<p.n;j++) s+=flower(cx(i),yv(j+.5),19,2+i*.5,'dim');});
   return s;}},
 {t:'Leemos el gráfico',s:'Desde la punta de la barra vamos derechito al eje y leemos el número de la escala.',
  draw(){
   let s=axes(false)+bars(false);
   D.forEach((p,i)=>{const d=.5+i*1.6,y=yv(p.n);
     s+=`<circle cx="${X0-33}" cy="${y}" r="20" fill="var(--hl)" stroke="var(--accent)" stroke-width="3" class="pop" ${st(d+.6)}/>`;
     s+=`<text x="${X0-33}" y="${y+8}" text-anchor="middle" font-size="24" font-weight="700" class="pop" ${st(d+.6)}>${p.n}</text>`;
     s+=`<line x1="${cx(i)-BW/2}" x2="${X0}" y1="${y}" y2="${y}" stroke="var(--accent)" stroke-width="4" stroke-dasharray="10 8" class="fade" ${st(d)}/>`;
     s+=`<text x="${cx(i)}" y="${y-12}" text-anchor="middle" font-size="30" font-weight="700" class="acc pop" ${st(d+.9)}>${p.n}</text>`;
   });
   return s;}},
 {t:'Comparamos',s:'Toca una pregunta. Piensa primero tu respuesta y después mira el gráfico.',
  draw(){return axes(false)+bars(false)+'<g id="ov"></g>';},
  extra(){
   const qs=[
    ['¿Qué planta tiene más flores?',()=>focus([1],'La planta B: su barra es la más alta. Tiene 7 flores.')],
    ['¿Qué planta tiene menos flores?',()=>focus([0],'La planta A: su barra es la más baja. Tiene 1 flor.')],
    ['¿Cuántas flores más tiene B que D?',()=>{focus([1,3]);const ov=document.getElementById('ov'),x=cx(3)+BW/2+18;
       ov.innerHTML=`<line x1="${cx(1)+BW/2}" x2="${x+10}" y1="${yv(7)}" y2="${yv(7)}" stroke="var(--accent)" stroke-width="3" stroke-dasharray="8 6"/>
       <line x1="${x}" x2="${x}" y1="${yv(7)}" y2="${yv(3)}" stroke="var(--accent)" stroke-width="5" class="grow"/>
       ${[4,5,6,7].map((v,k)=>`<text x="${x+14}" y="${yv(v)+U/2+8}" font-size="22" font-weight="700" class="acc pop" ${st(.6+k*.4)}>${k+1}</text>`).join('')}
       <text x="${x+40}" y="${yv(5)+8}" font-size="26" font-weight="700" class="pop" ${st(2.4)}>4 más</text>`;
       sayx('B tiene 7 y D tiene 3. Contamos los cuadritos de diferencia: 4 flores más.');}],
    ['¿Cuántas flores hay en total?',()=>{focus([0,1,2,3]);sayx('1 + 7 + 5 + 3 = 16 flores en total.');}]
   ];
   return qs;}},
 {t:'Palabras nuevas',s:'Estas son las partes de un gráfico de barras.',
  draw(){
   let s=axes(false)+bars(false);
   const tag=(x,y,w,txt,d,ax,ay)=>`<g class="pop" ${st(d)}><line x1="${x}" y1="${y}" x2="${ax}" y2="${ay}" stroke="var(--accent)" stroke-width="3"/><circle cx="${ax}" cy="${ay}" r="6" fill="var(--accent)"/><rect x="${x-w/2}" y="${y-22}" width="${w}" height="40" rx="10" fill="var(--hl)" stroke="var(--accent)" stroke-width="3"/><text x="${x}" y="${y+7}" text-anchor="middle" font-size="22" font-weight="700">${txt}</text></g>`;
   s+=tag(250,yv(7.6),110,'título',.3,330,48);
   s+=tag(250,yv(4.4),150,'eje vertical',1.2,X0,yv(4.4));
   s+=tag(90,yv(-1.6),110,'escala',2.1,X0-40,yv(2));
   s+=tag(620,yv(-1.6),190,'eje horizontal',3,560,Y0);
   s+=tag(720,yv(6.2),110,'barras',3.9,cx(2),yv(4));
   return s;}},
 {t:'También puede ser horizontal',s:'Las barras se acuestan: ahora la escala está abajo. ¡Es la misma información: cada barra sigue llegando al mismo número!',
  draw(){
   const HX=140,HY=440,HU=70,row=i=>110+i*82,xv=v=>HX+v*HU;
   let s=`<g class="out" ${st(.6)}>${axes(false)}</g>`;
   let h=``;
   for(let v=1;v<=8;v++) h+=`<line x1="${xv(v)}" x2="${xv(v)}" y1="70" y2="${HY}" stroke="var(--grid)" stroke-width="2"/>`;
   h+=`<line x1="${HX}" y1="${HY}" x2="${HX}" y2="62" stroke="var(--ink)" stroke-width="4"/><line x1="${HX}" y1="${HY}" x2="${xv(8)+14}" y2="${HY}" stroke="var(--ink)" stroke-width="4"/>`;
   for(let v=0;v<=8;v++) h+=`<text x="${xv(v)}" y="${HY+30}" text-anchor="middle" font-size="22" font-weight="700">${v}</text>`;
   h+=`<text x="${(HX+xv(8))/2}" y="505" text-anchor="middle" font-size="22">Número de flores</text>`;
   h+=`<text x="50" y="275" transform="rotate(-90 50 275)" text-anchor="middle" font-size="22">Plantas</text>`;
   D.forEach((p,i)=>h+=`<text x="${HX-18}" y="${row(i)+10}" text-anchor="end" font-size="28" font-weight="700">${p.k}</text>`);
   s+=`<g class="fade" ${st(2.4)}>${h}</g><text x="460" y="40" text-anchor="middle" font-size="28" font-weight="700">Flores en 4 plantas</text>`;
   D.forEach((p,i)=>{
     const from=`translate(${cx(i)-HX}px,${Y0-row(i)}px) rotate(-90deg) scale(${(U/HU).toFixed(3)},${(BW/56).toFixed(3)})`;
     s+=`<rect x="${HX}" y="${row(i)-28}" width="${p.n*HU}" height="56" fill="${p.c}" stroke="var(--ink)" stroke-width="2" vector-effect="non-scaling-stroke" class="tip" style="--from:${from};animation-delay:${1+i*.35}s"/>`;
     s+=`<text x="${xv(p.n)+12}" y="${row(i)+10}" font-size="26" font-weight="700" class="acc pop" ${st(3+i*.4)}>${p.n}</text>`;});
   return s;}}
];

const $=id=>document.getElementById(id);
let cur=0;
function sayx(t){$('say').textContent=t;}
function focus(idx,txt){D.forEach((_,i)=>$('bar'+i).classList.toggle('faded',!idx.includes(i)));
  $('ov').innerHTML='';if(txt)sayx(txt);}
function render(){
  const S=steps[cur];
  $('num').textContent=cur+1;$('title').textContent=S.t;$('say').textContent=S.s;
  $('stage').innerHTML=S.draw();
  const ex=$('extra');ex.innerHTML='';
  if(S.extra) S.extra().forEach(([q,fn],k)=>{const b=document.createElement('button');b.className='q';b.id='q'+k;b.textContent=q;b.setAttribute('aria-pressed','false');
    b.onclick=()=>{ex.querySelectorAll('.q').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');fn();};ex.appendChild(b);});
  $('prev').disabled=cur===0;$('next').disabled=cur===steps.length-1;
  document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('on',i===cur));
}
steps.forEach((s,i)=>{const b=document.createElement('button');b.className='dot';b.setAttribute('aria-label','Paso '+(i+1)+': '+s.t);b.onclick=()=>{cur=i;render();};$('dots').appendChild(b);});
$('prev').onclick=()=>{if(cur>0){cur--;render();}};
$('next').onclick=()=>{if(cur<steps.length-1){cur++;render();}};
$('again').onclick=render;
addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('button')&&e.key===' ')return;
  if(e.key==='ArrowRight'){$('next').click();}else if(e.key==='ArrowLeft'){$('prev').click();}else if(e.key===' '){e.preventDefault();render();}});
render();
</script>
</body>
</html>
