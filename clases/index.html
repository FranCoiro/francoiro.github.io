<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Clases de Francisca Coiro Díaz organizadas por curso y fecha: presentaciones y guías.">
<title>Clases · Francisca Coiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Mismo sistema visual que la portada: pestañas por curso, clases en línea de fechas */
:root{
  --bg:#f6f5f1; --surface:#ffffff; --ink:#151a24; --soft:#596070; --faint:#9aa0ac; --line:#e4e2dc;
  --accent:#1f7a5c; --accent-soft:#e3f1ea; --on-accent:#ffffff;
  --f-display:"Fraunces", Georgia, serif;
  --f-body:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1218; --surface:#171b23; --ink:#eceef2; --soft:#a8aebb; --faint:#6c7282; --line:#272c36;
  --accent:#5fd0a3; --accent-soft:#16322a; --on-accent:#08261b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1218; --surface:#171b23; --ink:#eceef2; --soft:#a8aebb; --faint:#6c7282; --line:#272c36;
  --accent:#5fd0a3; --accent-soft:#16322a; --on-accent:#08261b; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16.5px;line-height:1.6;
  background-image:radial-gradient(var(--line) 1px,transparent 1.2px);background-size:26px 26px;background-attachment:fixed}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.wrap{max-width:860px;margin:0 auto;padding-block:40px 64px;
  padding-left:max(20px, env(safe-area-inset-left, 0px));padding-right:max(20px, env(safe-area-inset-right, 0px))}
.back{font-size:.9rem;color:var(--soft);text-decoration:none}
.back:hover{color:var(--ink)}
h1{font-family:var(--f-display);font-weight:500;font-size:clamp(2rem,5vw,2.8rem);line-height:1.1;margin:18px 0 6px;text-wrap:balance}
.lead{color:var(--soft);margin:0 0 28px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:24px}
.tabs button{font:500 .92rem var(--f-body);color:var(--soft);background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:7px 15px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.list{display:flex;flex-direction:column;gap:12px}
.item{display:grid;grid-template-columns:110px 1fr;gap:18px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.date{font-family:var(--f-mono);font-size:.85rem;color:var(--soft);font-variant-numeric:tabular-nums;padding-top:3px}
.date b{display:block;font-family:var(--f-display);font-weight:500;font-size:1.6rem;color:var(--ink);line-height:1.1}
.item h2{font-family:var(--f-display);font-weight:500;font-size:1.25rem;margin:0 0 4px;line-height:1.25}
.item p{margin:0 0 12px;color:var(--soft);min-width:0}
.mats{display:flex;flex-wrap:wrap;gap:8px}
.mats a{font-size:.88rem;font-weight:500;text-decoration:none;padding:5px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.mats a:hover{text-decoration:underline}
.empty{color:var(--soft);padding:24px;text-align:center;border:1px dashed var(--line);border-radius:16px}
@media (max-width:520px){.item{grid-template-columns:1fr;gap:6px}.date b{display:inline;font-size:1.2rem;margin-right:6px}}
</style>
</head>
<body>
<main class="wrap">
  <a class="back" href="../">← Volver al inicio</a>
  <h1>Clases</h1>
  <p class="lead">Presentaciones y guías organizadas por curso y fecha.</p>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="list" id="list"><p class="empty">Cargando clases…</p></div>
</main>
<script>
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sept','oct','nov','dic'];
const tabs = document.getElementById('tabs'), list = document.getElementById('list');
let data = { cursos: [], clases: [] }, actual = null;

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function pintar(){
  tabs.innerHTML = '';
  data.cursos.forEach(c => {
    const b = document.createElement('button');
    b.setAttribute('role','tab'); b.setAttribute('aria-selected', c.id === actual);
    b.textContent = c.nombre + (c.asignatura ? ' · ' + c.asignatura : '');
    b.onclick = () => { actual = c.id; location.hash = c.id; pintar(); };
    tabs.appendChild(b);
  });
  const clases = data.clases.filter(x => x.curso === actual).sort((a,b) => b.fecha.localeCompare(a.fecha));
  if (!clases.length){ list.innerHTML = '<p class="empty">Todavía no hay clases en este curso.</p>'; return; }
  list.innerHTML = clases.map(x => {
    const [y,m,d] = x.fecha.split('-');
    const mats = (x.materiales || []).map(mt =>
      `<a href="${esc(x.carpeta + mt.archivo)}">${esc(mt.nombre)}</a>`).join('');
    return `<article class="item">
      <div class="date"><b>${+d}</b>${MESES[+m-1]} ${y}</div>
      <div><h2>${esc(x.titulo)}</h2>${x.descripcion ? `<p>${esc(x.descripcion)}</p>` : ''}<div class="mats">${mats}</div></div>
    </article>`;
  }).join('');
}

fetch('clases.json', { cache: 'no-cache' })
  .then(r => r.json())
  .then(j => {
    data = j;
    const h = location.hash.slice(1);
    actual = data.cursos.some(c => c.id === h) ? h : (data.cursos[0] || {}).id;
    pintar();
  })
  .catch(() => { list.innerHTML = '<p class="empty">No se pudo cargar la lista de clases.</p>'; });
</script>
</body>
</html>
