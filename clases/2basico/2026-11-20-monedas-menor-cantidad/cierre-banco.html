<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cierre: Javiera va al banco (quiz)</title>
<style>
  :root {
    --azul: #2b6cb0; --verde: #26890c; --rojo: #e21b3c; --amar: #d89e00; --azulk: #1368ce;
    --coin: min(7vw, 15vh, 130px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: "Nunito", "DejaVu Sans", Arial, sans-serif; background: #46178f; color: #1a202c; overflow: hidden; }
  .app { height: 100vh; display: grid; grid-template-rows: auto 1fr auto auto; padding: 1.6vh 2vw; gap: 1.4vh; }

  .qbar { background: #fff; border-radius: 12px; padding: 1.2vh 2vw; display: flex; align-items: center; gap: 2vw; box-shadow: 0 4px 0 rgba(0,0,0,.25); }
  .qnum { font-size: clamp(14px, 1.5vw, 22px); font-weight: 800; color: #46178f; white-space: nowrap; }
  .qtext { flex: 1; text-align: center; font-size: clamp(24px, 3.8vw, 54px); font-weight: 800; line-height: 1.2; }

  .mid { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 2vw; min-height: 0; }
  .timer { width: min(9vw, 120px); height: min(9vw, 120px); border-radius: 50%; background: #864cbf; color: #fff; display: flex; align-items: center; justify-content: center; font-size: clamp(26px, 3.6vw, 52px); font-weight: 800; box-shadow: 0 4px 0 rgba(0,0,0,.25); }
  .timer.off { visibility: hidden; }
  .stats { display: flex; flex-direction: column; gap: 1.2vh; }
  .stat { background: #fff; border-radius: 12px; padding: .6vh 1.2vw; text-align: center; min-width: 9vw; transition: transform .3s; box-shadow: 0 4px 0 rgba(0,0,0,.25); }
  .stat .lbl { font-size: clamp(11px, 1.2vw, 16px); color: #4a5568; font-weight: 800; }
  .stat .val { font-size: clamp(22px, 3vw, 42px); font-weight: 800; }
  .stat.bump { transform: scale(1.15); }
  #statPlata .val { color: var(--verde); }
  #statMonedas .val { color: var(--azulk); }

  .stage { position: relative; height: 100%; min-height: 22vh; }
  .coin { position: absolute; width: var(--coin); height: var(--coin); transition: left .7s ease, top .7s ease, transform .5s ease, opacity .5s ease, filter .3s; }
  .coin svg { width: 100%; height: 100%; display: block; }
  .coin.sel { transform: translateY(-14%) scale(1.06); filter: drop-shadow(0 0 10px #f6ad55) drop-shadow(0 0 4px #ed8936); }
  .coin.lit { filter: drop-shadow(0 0 12px #9ae6b4) drop-shadow(0 0 4px #38a169); transform: scale(1.08); }
  .coin.gone { opacity: 0; transform: scale(.3); }
  .coin.new { transform: scale(0); }
  .bubble { position: absolute; transform: translate(-50%, -100%); background: #fff; color: var(--verde); font-weight: 800; font-size: clamp(18px, 2.2vw, 30px); padding: .25em .6em; border-radius: 12px; opacity: 0; transition: opacity .2s, left .25s, top .25s; pointer-events: none; white-space: nowrap; box-shadow: 0 3px 0 rgba(0,0,0,.25); }
  .bubble.on { opacity: 1; }
  .msg { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); background: #fff; border-radius: 12px; padding: .6vh 1.6vw; font-size: clamp(16px, 2vw, 28px); font-weight: 800; color: #46178f; opacity: 0; transition: opacity .4s; white-space: nowrap; }
  .msg.on { opacity: 1; }

  .answers { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1.2vh 1vw; }
  .ans { position: relative; display: flex; align-items: center; justify-content: center; gap: 1.2vw; padding: 1.4vh 1.4vw; border-radius: 8px; color: #fff; font-size: clamp(26px, 4vw, 60px); font-weight: 800; min-height: 9vh; box-shadow: 0 5px 0 rgba(0,0,0,.25); transition: opacity .4s, transform .3s; }
  .ans .shape { width: clamp(28px, 3.2vw, 48px); height: clamp(28px, 3.2vw, 48px); flex: none; }
  .ans .n { position: absolute; right: 1vw; top: .6vh; font-size: clamp(14px, 1.6vw, 22px); opacity: .85; }
  .ans .mini { display: flex; gap: .25vw; flex-wrap: wrap; justify-content: center; }
  .ans .mini svg { width: clamp(26px, 3.2vw, 50px); height: clamp(26px, 3.2vw, 50px); }
  .a0 { background: var(--rojo); } .a1 { background: var(--azulk); } .a2 { background: var(--amar); } .a3 { background: var(--verde); }
  .answers.revealed .ans:not(.ok) { opacity: .25; }
  .answers.revealed .ans.ok { transform: scale(1.03); }
  .ans.ok::after { content: "✔"; position: absolute; right: 1.2vw; bottom: .6vh; font-size: clamp(22px, 3vw, 40px); }
  .answers.hide { visibility: hidden; }
  .answers.one { grid-template-columns: 1fr; }

  .frase { background: #fff; border-radius: 12px; padding: 1.4vh 2vw; font-size: clamp(22px, 3.2vw, 46px); font-weight: 800; color: var(--azul); text-align: center; display: none; }
  .frase.on { display: block; }

  .nav { display: flex; align-items: center; justify-content: space-between; }
  button { font: inherit; font-weight: 800; font-size: clamp(15px, 1.7vw, 22px); border: none; border-radius: 10px; padding: 1vh 1.8vw; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,.25); }
  #prev { background: #e2e8f0; color: #2d3748; }
  #main { background: #fff; color: #46178f; }
  button:disabled { opacity: .35; cursor: default; }
  .dots { display: flex; gap: 6px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,.35); }
  .dot.on { background: #fff; }
</style>
</head>
<body>
<div class="app">
  <div class="qbar"><div class="qnum" id="qnum"></div><div class="qtext" id="qtext"></div></div>
  <div class="mid">
    <div class="timer" id="timer">20</div>
    <div class="stage" id="stage"><div class="bubble" id="bubble"></div><div class="msg" id="msg"></div></div>
  </div>
  <div>
    <div class="answers" id="answers"></div>
    <div class="frase" id="frase"></div>
  </div>
  <div class="nav">
    <button id="prev">◀ Atrás</button>
    <div class="dots" id="dots"></div>
    <button id="main">Ver respuesta</button>
  </div>
</div>

<script>
const COIN_SVG = {
  10: '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="47" fill="#c8874a" stroke="#8a5a2b" stroke-width="3"/><circle cx="50" cy="50" r="38" fill="none" stroke="#e2b07e" stroke-width="2.5"/><text x="50" y="61" text-anchor="middle" font-size="30" font-weight="bold" fill="#fff" font-family="DejaVu Sans, Arial">$10</text></svg>',
  50: '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="47" fill="#e8c547" stroke="#a6871c" stroke-width="3"/><circle cx="50" cy="50" r="38" fill="none" stroke="#f7e39a" stroke-width="2.5"/><text x="50" y="61" text-anchor="middle" font-size="30" font-weight="bold" fill="#5c4708" font-family="DejaVu Sans, Arial">$50</text></svg>',
  100: '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="47" fill="#e8c547" stroke="#a6871c" stroke-width="3"/><circle cx="50" cy="50" r="33" fill="#cfd4da" stroke="#8d949c" stroke-width="2.5"/><text x="50" y="59" text-anchor="middle" font-size="22" font-weight="bold" fill="#222" font-family="DejaVu Sans, Arial">$100</text></svg>'
};
const SHAPES = [
  '<svg class="shape" viewBox="0 0 40 40"><polygon points="20,3 37,35 3,35" fill="#fff"/></svg>',
  '<svg class="shape" viewBox="0 0 40 40"><polygon points="20,2 38,20 20,38 2,20" fill="#fff"/></svg>',
  '<svg class="shape" viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="#fff"/></svg>',
  '<svg class="shape" viewBox="0 0 40 40"><rect x="4" y="4" width="32" height="32" fill="#fff"/></svg>'
];
const mini = arr => '<span class="mini">' + arr.map(v => COIN_SVG[v]).join('') + '</span>';

const INICIO = [50, 50, 10, 10, 10, 10, 10, 10, 10, 10];
const PASO1  = [50, 50, 50, 10, 10, 10];
const FINAL  = [100, 50, 10, 10, 10];

const Q = [
  { q: '¿Cuánta plata tiene Javiera?', coins: INICIO,
    opts: ['$100', '$180', '$130'], ok: 1,
    reveal: [['contar']], msg: '¡Tiene $180!' },
  { q: '¿Qué monedas le da el banco? (las menos posibles)', coins: INICIO,
    opts: [mini([50, 50, 50, 10, 10, 10]), mini([100, 50, 10, 10, 10]), mini([100, 100])], ok: 1, coinOpts: true,
    reveal: [['canje', [5, 6, 7, 8, 9], 50], ['canje', [0, 1], 100], ['contar']], after: FINAL,
    msg: '¡Misma plata, menos monedas!' },
  { q: '¿Por qué al banco le conviene usar menos monedas?', coins: FINAL, open: true,
    frase: 'Es más fácil de <u>contar</u> y <u>llevar</u>.<br>Cambio <b>5 de $10</b> por 1 de <b>$50</b>, y <b>2 de $50</b> por 1 de <b>$100</b>.' }
];

const $ = id => document.getElementById(id);
const stage = $('stage'), bubble = $('bubble'), msg = $('msg'), answers = $('answers'), frase = $('frase');
const timerEl = $('timer'), mainBtn = $('main'), prevBtn = $('prev');
let idx = 0, phase = 'ask', busy = false, coinEls = [], tId = null;

Q.forEach(() => { const d = document.createElement('div'); d.className = 'dot'; $('dots').appendChild(d); });
const sum = a => a.reduce((x, y) => x + y, 0);
const sleep = ms => new Promise(r => setTimeout(r, ms));

function coinPx() { const t = coinEls[0]; return t ? t.el.offsetWidth : 100; }
function positions(n) {
  const size = coinPx(), gap = size * 0.18, W = stage.clientWidth, H = stage.clientHeight;
  const perRow = Math.max(1, Math.min(n, Math.floor((W + gap) / (size + gap))));
  const rows = Math.ceil(n / perRow), totalH = rows * size + (rows - 1) * gap * 1.6, out = [];
  for (let i = 0; i < n; i++) {
    const r = Math.floor(i / perRow), c = i % perRow, inRow = Math.min(perRow, n - r * perRow);
    const rowW = inRow * size + (inRow - 1) * gap;
    out.push({ x: (W - rowW) / 2 + c * (size + gap), y: Math.max(0, (H - totalH) / 2 - size * 0.15) + r * (size + gap * 1.6) });
  }
  return out;
}
function makeCoin(v) { const el = document.createElement('div'); el.className = 'coin'; el.innerHTML = COIN_SVG[v]; stage.appendChild(el); return { v, el }; }
function layout() { const p = positions(coinEls.length); coinEls.forEach((c, i) => { c.el.style.left = p[i].x + 'px'; c.el.style.top = p[i].y + 'px'; }); }
function setCoins(vals) {
  coinEls.forEach(c => c.el.remove());
  coinEls = vals.map(makeCoin);
  coinEls.forEach(c => c.el.style.transition = 'none'); layout(); void stage.offsetWidth; coinEls.forEach(c => c.el.style.transition = '');
}
function stat(el, v, show) { el.querySelector('.val').textContent = show ? v : '?'; }
function bump(el) { el.classList.add('bump'); setTimeout(() => el.classList.remove('bump'), 450); }

function stopTimer() { clearInterval(tId); tId = null; }
function startTimer() {
  stopTimer(); let t = 20; timerEl.textContent = t; timerEl.classList.remove('off');
  tId = setInterval(() => { t--; timerEl.textContent = Math.max(t, 0); if (t <= 0) stopTimer(); }, 1000);
}

function render() {
  const s = Q[idx];
  $('qnum').textContent = (idx + 1) + ' / ' + Q.length;
  $('qtext').textContent = s.q;
  setCoins(phase === 'done' && s.after ? s.after : s.coins);
  msg.classList.toggle('on', phase === 'done' && !!s.msg); msg.textContent = s.msg || '';
  bubble.classList.remove('on');
  answers.innerHTML = '';
  answers.className = 'answers' + (s.open ? ' hide' : '') + (phase === 'done' ? ' revealed' : '');
  if (s.opts) s.opts.forEach((o, i) => {
    const d = document.createElement('div');
    d.className = 'ans a' + i + (phase === 'done' && i === s.ok ? ' ok' : '');
    d.innerHTML = SHAPES[i] + '<span>' + o + '</span><span class="n">' + (i + 1) + '</span>';
    answers.appendChild(d);
  });
  frase.innerHTML = s.frase || ''; frase.classList.toggle('on', !!s.open && phase === 'done');
  if (s.open) answers.style.display = phase === 'done' ? 'none' : ''; else answers.style.display = '';
  if (phase === 'ask' && !s.open) startTimer(); else { stopTimer(); timerEl.classList.add('off'); }
  mainBtn.textContent = phase === 'ask' ? 'Ver respuesta' : (idx === Q.length - 1 ? '¡Terminamos!' : 'Siguiente ▶');
  mainBtn.disabled = busy || (phase === 'done' && idx === Q.length - 1);
  prevBtn.disabled = busy || (idx === 0 && phase === 'ask');
  [...$('dots').children].forEach((d, i) => d.classList.toggle('on', i === idx));
}

async function animContar() {
  let acc = 0;
  for (const c of coinEls) {
    acc += c.v; c.el.classList.add('lit');
    bubble.textContent = '$' + acc;
    bubble.style.left = (c.el.offsetLeft + c.el.offsetWidth / 2) + 'px';
    bubble.style.top = (c.el.offsetTop - 6) + 'px';
    bubble.classList.add('on');
    await sleep(700);
  }
  bubble.classList.remove('on');
  await sleep(300); coinEls.forEach(c => c.el.classList.remove('lit'));
}
async function animMonedas() {
  for (let i = 0; i < coinEls.length; i++) {
    const c = coinEls[i]; c.el.classList.add('lit');
    bubble.textContent = i + 1;
    bubble.style.left = (c.el.offsetLeft + c.el.offsetWidth / 2) + 'px';
    bubble.style.top = (c.el.offsetTop - 6) + 'px';
    bubble.classList.add('on');
    await sleep(450);
  }
  bubble.classList.remove('on');
  await sleep(300); coinEls.forEach(c => c.el.classList.remove('lit'));
}
async function animCanje(s) {
  const chosen = s.sel.map(i => coinEls[i]);
  chosen.forEach(c => c.el.classList.add('sel'));
  await sleep(700);
  const cx = chosen.reduce((a, c) => a + c.el.offsetLeft, 0) / chosen.length;
  const cy = chosen.reduce((a, c) => a + c.el.offsetTop, 0) / chosen.length;
  chosen.forEach(c => { c.el.style.left = cx + 'px'; c.el.style.top = cy + 'px'; });
  await sleep(800);
  chosen.forEach(c => c.el.classList.add('gone'));
  const nueva = makeCoin(s.nuevo);
  nueva.el.style.transition = 'none'; nueva.el.style.left = cx + 'px'; nueva.el.style.top = cy + 'px';
  nueva.el.classList.add('new'); void nueva.el.offsetWidth;
  nueva.el.style.transition = ''; nueva.el.classList.remove('new'); nueva.el.classList.add('lit');
  await sleep(550);
  chosen.forEach(c => c.el.remove());
  coinEls = [nueva, ...coinEls.filter(c => !chosen.includes(c))].sort((a, b) => b.v - a.v);
  layout();
  await sleep(800); nueva.el.classList.remove('lit');
}

async function reveal() {
  const s = Q[idx];
  stopTimer(); timerEl.classList.add('off');
  busy = true; mainBtn.disabled = true; prevBtn.disabled = true;
  answers.classList.add('revealed');
  if (s.opts) answers.children[s.ok].classList.add('ok');
  if (s.open) { answers.style.display = 'none'; frase.classList.add('on'); }
  for (const r of (s.reveal || [])) {
    if (r[0] === 'contar') await animContar();
    if (r[0] === 'canje') await animCanje({ sel: r[1], nuevo: r[2] });
  }
  msg.textContent = s.msg || ''; msg.classList.toggle('on', !!s.msg);
  busy = false; phase = 'done';
  mainBtn.textContent = idx === Q.length - 1 ? '¡Terminamos!' : 'Siguiente ▶';
  mainBtn.disabled = idx === Q.length - 1; prevBtn.disabled = false;
}

function next() {
  if (busy) return;
  if (phase === 'ask') { reveal(); return; }
  if (idx < Q.length - 1) { idx++; phase = 'ask'; render(); }
}
function prev() {
  if (busy) return;
  if (phase === 'done') { phase = 'ask'; render(); return; }
  if (idx > 0) { idx--; phase = 'done'; render(); }
}
mainBtn.onclick = next; prevBtn.onclick = prev;
document.addEventListener('keydown', e => {
  if (['ArrowRight', ' ', 'PageDown', 'Enter'].includes(e.key)) { e.preventDefault(); next(); }
  if (['ArrowLeft', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); prev(); }
});
window.addEventListener('resize', layout);
render();
</script>
</body>
</html>
