<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}[hidden]{display:none!important}</style>
<title>Pictogramas paso a paso</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Patrick+Hand&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Proyector de aula: barra de situaciones arriba, escenario 16:9 al centro, controles grandes abajo. Un solo tema claro, pensado para proyectar. */
:root{
  --paper:#eef2f7; --stage:#ffffff; --ink:#1e2833; --muted:#5b6878; --line:#c9d3df;
  --accent:#2f62d6; --accent-soft:#e3ebfb; --more:#2e9a5a; --more-soft:#dcf2e4; --less:#d9711c; --less-soft:#fbe8d6;
  --display:"Baloo 2", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --body:"Nunito", "Segoe UI", Arial, sans-serif;
  color-scheme: light;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);}
.app{height:100%;display:flex;flex-direction:column;gap:10px;padding-block:10px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));box-sizing:border-box}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.brand{font-family:var(--display);font-weight:800;font-size:1.35rem;margin-right:auto}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button,.ctrl button{font:inherit;font-weight:800;border:2px solid var(--line);background:var(--stage);color:var(--ink);border-radius:999px;padding:.45em 1em;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stagewrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
.nav{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:clamp(44px,5vw,72px);height:clamp(44px,5vw,72px);border-radius:50%;border:3px solid var(--accent);background:var(--stage);color:var(--accent);font-size:clamp(30px,3.6vw,52px);font-weight:800;line-height:1;cursor:pointer;opacity:.85;box-shadow:0 4px 14px rgba(30,40,51,.18);display:flex;align-items:center;justify-content:center;padding:0 0 .12em}
.nav:hover{opacity:1;background:var(--accent);color:#fff}
.nav:disabled{opacity:.25;cursor:default}
.navL{left:6px}.navR{right:6px}
#stage{width:100%;height:100%;max-width:100%;display:block;cursor:pointer}
.ctrl{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px}
.ctrl .main{background:var(--accent);border-color:var(--accent);color:#fff;font-size:1.1rem;padding:.55em 1.4em}
.ctrl button:disabled{opacity:.4;cursor:default}
.where{min-width:12em;text-align:center;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.where b{color:var(--ink)}
.hint{font-size:.85rem;color:var(--muted);text-align:center}
svg text{font-family:var(--body);fill:var(--ink)}
svg .disp{font-family:var(--display);font-weight:800}
.pop{animation:pop .45s cubic-bezier(.3,1.5,.6,1) both;transform-box:fill-box;transform-origin:center}
.fade{animation:fade .5s ease both}
.rise{animation:rise .5s ease both}
@keyframes pop{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.dim{opacity:.16;transition:opacity .4s}
@keyframes walkL{0%{transform:translate(-420px,0)}15%{transform:translate(-350px,-14px)}30%{transform:translate(-280px,0)}45%{transform:translate(-210px,-14px)}60%{transform:translate(-140px,0)}75%{transform:translate(-70px,-14px)}100%{transform:none}}
@keyframes walkR{0%{transform:translate(420px,0)}15%{transform:translate(350px,-14px)}30%{transform:translate(280px,0)}45%{transform:translate(210px,-14px)}60%{transform:translate(140px,0)}75%{transform:translate(70px,-14px)}100%{transform:none}}
.walkL{animation:walkL 1.4s ease-out both}.walkR{animation:walkR 1.4s ease-out both}
.emote{animation:pop .5s cubic-bezier(.3,1.6,.6,1) both;transform-box:fill-box;transform-origin:center}
.floaty{animation:floaty 1.8s .5s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.drop{animation:drop .8s cubic-bezier(.3,1.4,.5,1) both}
@keyframes drop{0%{opacity:0;transform:translateY(-320px)}60%{opacity:1}100%{opacity:1;transform:none}}
.wig{animation:wig .7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes wig{0%,100%{transform:rotate(-9deg) scale(1.08)}50%{transform:rotate(9deg) scale(1.08)}}
.conf{animation:fall linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes fall{from{transform:translateY(-80px) rotate(0)}to{transform:translateY(820px) rotate(540deg)}}
@media (prefers-reduced-motion: reduce){.pop,.fade,.rise,.walkL,.walkR,.emote,.floaty,.drop,.wig,.conf{animation:none}}
@media (max-width:600px){.brand{font-size:1.1rem}.hint{display:none}}
</style>
</head>
<body>

<div class="app">
  <div class="top">
    <div class="brand">Pictogramas paso a paso</div>
    <div class="tabs" id="tabs"></div>
    <button id="fs" class="tabs-btn" style="font:inherit;font-weight:800;border:2px solid var(--line);background:var(--stage);color:var(--ink);border-radius:999px;padding:.45em 1em;cursor:pointer">Pantalla completa</button>
  </div>
  <div class="stagewrap"><button class="nav navL" id="navL" aria-label="Paso anterior">‹</button><button class="nav navR" id="navR" aria-label="Paso siguiente">›</button><svg id="stage" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Escena de la situación"></svg></div>
  <div class="ctrl">
    <button id="prev">◀ Anterior</button>
    <div class="where" id="where"></div>
    <button id="next" class="main">Siguiente ▶</button>
  </div>
  <div class="hint">Avanza con clic en la escena, la barra espaciadora o las flechas. Teclas 1 a 4 para cambiar de situación.</div>
</div>

<script>
/* ---------- dibujos ---------- */
const sc=(f,cx,cy,s)=>`<g transform="translate(${cx} ${cy}) scale(${s}) translate(${-cx} ${-cy})">${f(cx,cy)}</g>`;
const I={
manzana:(cx,cy)=>`<circle cx="${cx}" cy="${cy+4}" r="27" fill="#e53935" stroke="#8e1b18" stroke-width="3"/><path d="M${cx} ${cy-22} q2 -12 6 -16" stroke="#5d4037" stroke-width="4" fill="none"/><ellipse cx="${cx+13}" cy="${cy-25}" rx="10" ry="5" fill="#43a047" transform="rotate(-25 ${cx+13} ${cy-25})"/>`,
naranja:(cx,cy)=>`<circle cx="${cx}" cy="${cy+2}" r="28" fill="#fb8c00" stroke="#a65500" stroke-width="3"/><circle cx="${cx-8}" cy="${cy-6}" r="5" fill="#ffb74d"/><ellipse cx="${cx+4}" cy="${cy-26}" rx="9" ry="4" fill="#43a047"/>`,
platano:(cx,cy)=>sc((cx,cy)=>`<path d="M${cx-30} ${cy-12} Q${cx-20} ${cy+32} ${cx+30} ${cy+16} Q${cx-5} ${cy+12} ${cx-22} ${cy-18} Z" fill="#fdd835" stroke="#9e8600" stroke-width="3" stroke-linejoin="round"/><rect x="${cx-30}" y="${cy-22}" width="8" height="10" fill="#5d4037"/>`,cx,cy,1.3),
uva:(cx,cy)=>{let s=`<path d="M${cx} ${cy-20} l4 -10" stroke="#5d4037" stroke-width="4"/>`;for(const[dx,dy]of[[-14,-12],[0,-12],[14,-12],[-7,0],[7,0],[0,12]])s+=`<circle cx="${cx+dx}" cy="${cy+dy}" r="9" fill="#8e24aa" stroke="#4a148c" stroke-width="2.5"/>`;return s},
pez:(cx,cy)=>`<path d="M${cx+18} ${cy} L${cx+36} ${cy-16} L${cx+36} ${cy+16} Z" fill="#1e88e5" stroke="#0d47a1" stroke-width="3" stroke-linejoin="round"/><ellipse cx="${cx-4}" cy="${cy}" rx="28" ry="18" fill="#42a5f5" stroke="#0d47a1" stroke-width="3"/><circle cx="${cx-16}" cy="${cy-4}" r="4" fill="#222"/>`,
pollito:(cx,cy)=>`<circle cx="${cx}" cy="${cy+8}" r="22" fill="#ffeb3b" stroke="#c9a800" stroke-width="3"/><circle cx="${cx+4}" cy="${cy-16}" r="15" fill="#ffeb3b" stroke="#c9a800" stroke-width="3"/><circle cx="${cx+8}" cy="${cy-19}" r="3" fill="#222"/><path d="M${cx+18} ${cy-16} l10 3 l-10 4 Z" fill="#fb8c00"/>`,
tortuga:(cx,cy)=>`<circle cx="${cx+30}" cy="${cy+4}" r="9" fill="#81c784" stroke="#2e7d32" stroke-width="3"/><ellipse cx="${cx-14}" cy="${cy+18}" rx="7" ry="6" fill="#81c784" stroke="#2e7d32" stroke-width="2.5"/><ellipse cx="${cx+14}" cy="${cy+18}" rx="7" ry="6" fill="#81c784" stroke="#2e7d32" stroke-width="2.5"/><path d="M${cx-28} ${cy+12} A28 26 0 0 1 ${cx+24} ${cy+12} Z" fill="#43a047" stroke="#1b5e20" stroke-width="3"/><circle cx="${cx-2}" cy="${cy-2}" r="7" fill="#2e7d32"/>`,
caracol:(cx,cy)=>`<path d="M${cx-30} ${cy+20} L${cx+30} ${cy+20} Q${cx+34} ${cy+8} ${cx+24} ${cy+4} L${cx+24} ${cy-14}" fill="#d7b98e" stroke="#7a5c33" stroke-width="3" stroke-linejoin="round"/><circle cx="${cx-4}" cy="${cy}" r="20" fill="#a1887f" stroke="#5d4037" stroke-width="3"/><path d="M${cx-4} ${cy} m-8 0 a8 8 0 1 1 8 8" fill="none" stroke="#5d4037" stroke-width="3"/>`,
lapiz:(cx,cy)=>`<g transform="rotate(-35 ${cx} ${cy})"><rect x="${cx-26}" y="${cy-8}" width="44" height="16" fill="#fdd835" stroke="#9e8600" stroke-width="3"/><path d="M${cx+18} ${cy-8} L${cx+34} ${cy} L${cx+18} ${cy+8} Z" fill="#ffe0b2" stroke="#9e8600" stroke-width="3" stroke-linejoin="round"/><rect x="${cx-36}" y="${cy-8}" width="10" height="16" fill="#f48fb1" stroke="#9e8600" stroke-width="3"/></g>`,
goma:(cx,cy)=>`<rect x="${cx-26}" y="${cy-14}" width="52" height="28" rx="6" fill="#ffffff" stroke="#555" stroke-width="3"/><rect x="${cx-4}" y="${cy-14}" width="30" height="28" rx="2" fill="#29b6f6" stroke="#555" stroke-width="3"/>`,
libro:(cx,cy)=>`<rect x="${cx-22}" y="${cy-26}" width="44" height="52" rx="3" fill="#e53935" stroke="#8e1b18" stroke-width="3"/><rect x="${cx-22}" y="${cy-26}" width="8" height="52" fill="#b71c1c"/><rect x="${cx-6}" y="${cy-12}" width="22" height="8" fill="#fff"/>`,
regla:(cx,cy)=>{let s=`<rect x="${cx-34}" y="${cy-11}" width="68" height="22" rx="3" fill="#a5d6a7" stroke="#2e7d32" stroke-width="3"/>`;for(let t=-26;t<30;t+=10)s+=`<line x1="${cx+t}" y1="${cy-11}" x2="${cx+t}" y2="${cy-2}" stroke="#2e7d32" stroke-width="2"/>`;return s},
galleta:(cx,cy)=>{let s=`<circle cx="${cx}" cy="${cy}" r="26" fill="#d9a35b" stroke="#8d5a1f" stroke-width="3"/>`;for(const[dx,dy]of[[-10,-10],[8,-12],[12,6],[-12,8],[0,0],[2,14]])s+=`<circle cx="${cx+dx}" cy="${cy+dy}" r="3.5" fill="#4e2a12"/>`;return s},
torta:(cx,cy)=>`<path d="M${cx-30} ${cy-4} L${cx+30} ${cy-18} L${cx+30} ${cy+20} L${cx-30} ${cy+20} Z" fill="#fff3e0" stroke="#8d5a1f" stroke-width="3" stroke-linejoin="round"/><path d="M${cx-30} ${cy-4} L${cx+30} ${cy-18} L${cx+30} ${cy-8} L${cx-30} ${cy+6} Z" fill="#f48fb1" stroke="#8d5a1f" stroke-width="3" stroke-linejoin="round"/><rect x="${cx-30}" y="${cy+9}" width="60" height="4" fill="#795548"/><circle cx="${cx+16}" cy="${cy-24}" r="7" fill="#e53935" stroke="#8e1b18" stroke-width="2"/>`,
alfajor:(cx,cy)=>`<ellipse cx="${cx}" cy="${cy+10}" rx="30" ry="9" fill="#5d4037" stroke="#3e2723" stroke-width="3"/><rect x="${cx-26}" y="${cy-3}" width="52" height="8" fill="#c68642"/><ellipse cx="${cx}" cy="${cy-6}" rx="30" ry="9" fill="#6d4c41" stroke="#3e2723" stroke-width="3"/>`,
dona:(cx,cy)=>{let s=`<circle cx="${cx}" cy="${cy}" r="27" fill="#d9a35b" stroke="#8d5a1f" stroke-width="3"/><path d="M${cx-23} ${cy-4} Q${cx-24} ${cy-24} ${cx} ${cy-23} Q${cx+24} ${cy-24} ${cx+23} ${cy-2} Q${cx+16} ${cy+4} ${cx+20} ${cy+12} Q${cx+6} ${cy+22} ${cx-8} ${cy+18} Q${cx-12} ${cy+10} ${cx-22} ${cy+10} Z" fill="#f06292" stroke="#ad1457" stroke-width="2.5"/><circle cx="${cx}" cy="${cy}" r="8" fill="#fafafa" stroke="#8d5a1f" stroke-width="3"/>`;for(const[dx,dy,c]of[[-12,-12,"#fff176"],[10,-14,"#4fc3f7"],[14,4,"#aed581"],[-14,4,"#ffffff"],[0,-18,"#ffffff"],[2,13,"#fff176"]])s+=`<rect x="${cx+dx-3}" y="${cy+dy-1.5}" width="6" height="3" rx="1.5" fill="${c}" transform="rotate(${dx*4} ${cx+dx} ${cy+dy})"/>`;return s},
};
const headTop=(by,p,s)=>by-(p[5]?240:212)*s*(p[4]?1.15:1);
function wrap(t,n){const o=[];let c='';for(const w of t.split(' ')){if(c&&(c+' '+w).length>n){o.push(c);c=w}else c=(c?c+' ':'')+w}o.push(c);return o}
function lines(x,y,arr,size,attrs=''){const y0=y-(arr.length-1)*size*0.62;return arr.map((l,i)=>`<text x="${x}" y="${y0+i*size*1.25+size*0.35}" text-anchor="middle" font-size="${size}" ${attrs}>${l}</text>`).join('')}
function bubble(x,y,w,h,text,tx,ty,size,cls){
  const bx=Math.min(Math.max(tx,x+45),x+w-45);
  let s=`<g class="${cls||''}"><path d="M${bx-18} ${y+h-4} L${tx} ${ty} L${bx+18} ${y+h-4}" fill="#fff" stroke="#333" stroke-width="4" stroke-linejoin="round"/>`;
  s+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="30" fill="#fff" stroke="#333" stroke-width="4"/><rect x="${bx-14}" y="${y+h-7}" width="28" height="10" fill="#fff"/>`;
  return s+lines(x+w/2,y+h/2,wrap(text,Math.floor(w/(size*0.56))),size)+`</g>`;
}

/* ---------- datos ---------- */
const MAMA=["#f1c27d","#a1887f","#26a69a",false,true,false], SOFIA=["#f1c27d","#4e342e","#7e57c2",true,false,false],
PEPE=["#d9a066","#9e9e9e","#5d4037",false,true,true], MATIAS=["#8d5524","#212121","#ffca28",false,false,false],
PROFE=["#f1c27d","#5d4037","#5c6bc0",true,true,false], BENJA=["#e0ac69","#ff8f00","#66bb6a",false,false,false],
ROSA=["#c68642","#212121","#8d6e63",false,true,true], AMANDA=["#f1c27d","#3e2723","#ec407a",true,false,false];
const SITS=[
 {t:"Frutas de la canasta",bg:"#fff8e1",scene:"#ffe9c7",who:[MAMA,SOFIA],unit:"frutas",one:"fruta",
  talk:[[0,"Mañana es la once del curso y debo llevar fruta para todos."],[1,"¡Hagamos brochetas con una fruta de cada tipo!"],[0,"Pero no sé qué fruta alcanza y cuál falta comprar."],[1,"¡Contemos la canasta! La que tenga menos, la compramos."]],
  cap:"Esta es la canasta. ¿Qué fruta falta comprar?",
  cols:[["Manzanas",6,"manzana","f"],["Plátanos",3,"platano","m"],["Uvas",8,"uva","f"],["Naranjas",5,"naranja","f"]],
  end:[[1,"¡Hay que comprar plátanos! Tenemos solo 3."],[0,"Y ya tenemos 22 frutas en total. ¡Vamos a la feria!"]]},
 {t:"Animales de la mascotería",bg:"#e3f2fd",scene:"#d4ecd5",who:[PEPE,MATIAS],unit:"animales",one:"animal",
  talk:[[0,"¡Ay, no! Se me acabó la comida de los animales."],[1,"¡Pobrecitos! ¿Y cuánta comida tiene que pedir?"],[0,"Debo saber cuántos hay de cada uno para no equivocarme."],[1,"¡Yo lo ayudo a contar! Así ninguno se queda sin comer."]],
  cap:"Estos son los animales de don Pepe.",
  cols:[["Peces",4,"pez","m"],["Pollitos",7,"pollito","m"],["Tortugas",2,"tortuga","f"],["Caracoles",5,"caracol","m"]],
  end:[[0,"¡Son 18 animales! Ya puedo hacer el pedido."],[1,"Pida más comida para pollitos: ¡son los que más hay!"]]},
 {t:"Útiles de la sala",bg:"#f3e5f5",scene:"#e6dcd6",who:[PROFE,BENJA],unit:"útiles",one:"útil",
  talk:[[0,"¡El director nos va a regalar útiles nuevos!"],[1,"¡Bacán! ¿Nos va a regalar de todo?"],[0,"Solo del útil que tengamos menos. Hay que avisarle hoy."],[1,"¡Entonces contemos lo que hay sobre la mesa!"]],
  cap:"Estos son los útiles de la mesa. ¿De cuál tenemos menos?",
  cols:[["Lápices",7,"lapiz","m"],["Gomas",4,"goma","f"],["Libros",6,"libro","m"],["Reglas",2,"regla","f"]],
  end:[[1,"¡Hay que pedir reglas! Solo tenemos 2."],[0,"¡Muy bien! Le aviso al director ahora mismo."]]},
 {t:"Pasteles más vendidos",bg:"#fce4ec",scene:"#fff8dc",who:[ROSA,AMANDA],unit:"pasteles",one:"pastel",
  talk:[[0,"Mañana es la fiesta del barrio y vendrá muchísima gente."],[1,"¿Qué pastel vas a hornear, tía Rosa?"],[0,"¡El que más se vendió hoy! Pero perdí la cuenta..."],[1,"¡Dibujaste cada venta en tu cuaderno! Contémoslas."]],
  cap:"El cuaderno de tía Rosa. ¿Qué pastel se vendió más?",
  cols:[["Galletas",5,"galleta","f"],["Tortas",3,"torta","f"],["Alfajores",4,"alfajor","m"],["Donas",7,"dona","f"]],
  end:[[1,"¡Las donas! Se vendieron 7, más que todos los otros."],[0,"¡Mañana horneo muchas donas para la fiesta!"]]},
];
const STORYQ=[["¿Qué fruta falta comprar?", "Plátanos", "Es la fruta que tiene menos: solo hay 3."], ["¿Para cuántos animales debe pedir comida don Pepe?", "Para 18 animales", "4 peces, 7 pollitos, 2 tortugas y 5 caracoles."], ["¿De qué útil tenemos menos?", "Reglas", "Solo hay 2. Hay que pedirle reglas al director."], ["¿Qué pastel se vendió más?", "Donas", "Se vendieron 7. Tía Rosa debe hornear donas."]];
const art=(g)=>g==="f"?"Las":"Los", cuantos=(g)=>g==="f"?"¿Cuántas":"¿Cuántos";

/* posiciones mezcladas (fijas por situación) */
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
SITS.forEach((S,k)=>{
  const r=rng(101+k*13); const slots=[];
  for(let row=0;row<4;row++)for(let c=0;c<8;c++)slots.push([c,row]);
  for(let i=slots.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[slots[i],slots[j]]=[slots[j],slots[i]]}
  const items=[];S.cols.forEach((c,ci)=>{for(let n=0;n<c[1];n++)items.push(ci)});
  for(let i=items.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[items[i],items[j]]=[items[j],items[i]]}
  S.items=items.map((ci,i)=>({ci,x:100+slots[i][0]*117+Math.round((r()-.5)*20),y:300+slots[i][1]*148+Math.round((r()-.5)*20)}));
  S.cols.forEach((c,ci)=>{S.items.filter(it=>it.ci===ci).sort((a,b)=>a.y-b.y||a.x-b.x).forEach((it,o)=>it.ord=o)});
  const n=S.cols.map(c=>c[1]); S.total=n.reduce((a,b)=>a+b,0);
  S.max=n.indexOf(Math.max(...n)); S.min=n.indexOf(Math.min(...n));
  S.steps=buildSteps(S);
});
SITS[0].steps.unshift({scr:"obj"});
function buildSteps(S){
  const st=[];
  for(let pi=0;pi<2;pi++)for(let n=0;n<=2;n++)st.push({scr:"comic",pi,n});
  st.push({scr:"count",f:-1});
  S.cols.forEach((c,i)=>{st.push({scr:"count",f:i,ph:"ask"});st.push({scr:"count",f:i,ph:"rev"})});
  st.push({scr:"task"});
  st.push({scr:"picto",q:0});
  for(let q=1;q<=3;q++){st.push({scr:"picto",q,ans:false});st.push({scr:"picto",q,ans:true})}
  st.push({scr:"story",ans:false});st.push({scr:"story",ans:true});
  for(let b=0;b<=2;b++)st.push({scr:"end",b});
  return st;
}
const LABEL={obj:"Objetivo",task:"Trabajo en la hoja",story:"Pregunta de la historia",comic:"Historia",count:"Tabla de conteo",picto:"Pictograma y preguntas",end:"Final"};

/* ---------- pantallas ---------- */
const title=(k,S)=>`<text x="800" y="64" text-anchor="middle" font-size="46" class="disp">Situación ${k+1}: ${S.t}</text>`;
const panel=(x,y,w,h,bg)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="18" fill="${bg}" stroke="#1e2833" stroke-width="6"/>`;
const badge=(x,y,n)=>`<circle cx="${x}" cy="${y}" r="22" fill="#1e2833"/><text x="${x}" y="${y+9}" text-anchor="middle" font-size="26" font-weight="800" style="fill:#fff">${n}</text>`;

function tally(x,cy,n,delay,stepT){
  let o='';
  for(let k=0;k<n;k++){

    s+=`${sc(I.torta,cx-60,fy-60,.9)}${sc(I.dona,cx+5,fy-60,.8)}${sc(I.galleta,cx+65,fy-60,.8)}${sc(I.alfajor,cx-50,fy+15,.8)}${sc(I.dona,cx+20,fy+15,.8)}${sc(I.galleta,cx+80,fy+15,.7)}`;
    for(let i=0;i<3;i++) s+=`<path d="M${cx-70+i*10} ${fy-100} q-8 -12 0 -24 q8 -12 0 -24" stroke="#bbb" stroke-width="3" fill="none"><animate attributeName="opacity" values="0;1;0" dur="2s" begin="${i*.6}s" repeatCount="indefinite"/></path>`;
  }
  return s;
}
const EMO=[["ex","idea","q","idea"],["ex","sad","q","heart"],["ex","star","q","idea"],["heart","q","q","idea"]];
function comic(S,st,fresh){
  const k=sit, pi=st.pi, x=30,y=100,w=1540,h=770,by=835;
  const shown=st.n; // diálogos visibles en esta viñeta
  const last=shown>0?pi*2+shown-1:-1, speaking=last>=0?S.talk[last][0]:-1;
  fresh=fresh&&pi===0;
  let o=`<g class="${fresh?'fade':''}">${panel(x,y,w,h,S.bg)}<rect x="${x+3}" y="${y+h-130}" width="${w-6}" height="127" fill="#000" fill-opacity="0.07"/>${scenery(k,x+390,y,760,h,pi)}`;
  [0,1].forEach(wi=>{
    const px=wi===0?450:1150;
    const walk=fresh?` class="walk${wi===0?'L':'R'}"`:'';
    o+=`<g${walk}>${person(px,by,S.who[wi],1.5,speaking===wi?'talk':'idle',wi===0?1:-1,wi+pi*2)}</g>`;
  });
  o+=badge(x+40,y+40,pi+1)+`</g>`;
  for(let j=0;j<shown;j++){
    const idx=pi*2+j, [w0,txt]=S.talk[idx], px=w0===0?450:1150, bx=w0===0?130:890;
    o+=bubble(bx,130,580,230,txt,px,headTop(by,S.who[w0],1.5)-18,38,idx===last?'pop':'');
    if(idx===last) o+=emote(EMO[k][idx],px+(w0===0?-150:150),headTop(by,S.who[w0],1.5)+40);
  }
  return o;
}
function story(S,st,fresh){
  const [q,a,why]=STORYQ[sit];
  let o=`<g class="${fresh?'fade':''}">${panel(30,100,1540,770,S.bg)}<rect x="33" y="740" width="1534" height="127" fill="#000" fill-opacity="0.07"/>`;
  o+=person(220,835,S.who[0],1.4,'idle',1,0)+person(1380,835,S.who[1],1.4,'idle',-1,1);
  o+=`<text x="800" y="175" text-anchor="middle" font-size="34" font-weight="800" style="fill:var(--muted)">Volvamos a la pregunta de la historia</text>`;
  o+=`<rect x="370" y="205" width="860" height="200" rx="26" fill="#fff59d" stroke="#1e2833" stroke-width="5"/>`+lines(800,305,wrap(q,30),52,`class="disp"`)+`</g>`;
  if(st.ans){
    o+=`<g class="pop"><rect x="420" y="450" width="760" height="250" rx="26" fill="var(--more-soft)" stroke="var(--more)" stroke-width="6"/>`;
    o+=`<text x="800" y="560" text-anchor="middle" font-size="76" class="disp" style="fill:var(--more)">${a}</text>`+lines(800,640,wrap(why,48),32,`font-weight="700"`)+`</g>`;
    o+=emote("idea",S.talk[3][0]===0?220:1380,500);
  }
  return o;
}
function ending(S,st,fresh){
  let o=`<g class="${fresh?'fade':''}">${panel(30,100,1540,770,S.bg)}<rect x="33" y="740" width="1534" height="127" fill="#000" fill-opacity="0.07"/>`;
  if(st.b>=2){
    const r=rng(7+sit), cols=["#ef5350","#ffca28","#42a5f5","#66bb6a","#ab47bc","#ff7043"];
    o+=`<g clip-path="url(#endclip)">`;
    for(let i=0;i<70;i++){const cx=50+r()*1500;o+=`<rect class="conf" x="${cx}" y="60" width="${10+r()*8}" height="${16+r()*10}" rx="2" fill="${cols[i%6]}" style="animation-duration:${(2.2+r()*2).toFixed(2)}s;animation-delay:${(-r()*4).toFixed(2)}s"/>`}
    o+=`</g>`;
  }
  const last=st.b-1, speaking=last>=0?S.end[last][0]:-1;
  [0,1].forEach(wi=>{
    const px=wi===0?450:1150;
    const mode=st.b>=2?'jump':(speaking===wi?'talk':'idle');
    o+=person(px,835,S.who[wi],1.5,mode,wi===0?1:-1,wi);
  });
  o+=`</g>`;
  S.end.forEach(([w0,txt],i)=>{
    if(i>=st.b)return;
    const px=w0===0?450:1150, bx=w0===0?160:860;
    o+=bubble(bx,130,580,220,txt,px,headTop(835,S.who[w0],1.5)-18,36,i===last?'pop':'');
  });
  if(st.b===1) o+=emote("idea",S.end[0][0]===0?300:1300,520);
  if(st.b>=2) o+=emote("star",S.end[1][0]===0?300:1300,520);
  return o;
}

function objective(){
  const x=250,y=200,w=1100,h=560;
  let o=`<g class="fade"><text x="800" y="120" text-anchor="middle" font-size="60" class="disp">Objetivo de la clase</text>`;
  o+=`<rect x="${x+8}" y="${y+10}" width="${w}" height="${h}" rx="14" fill="#cfd8e3"/><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="14" fill="#fff" stroke="#1e2833" stroke-width="5"/>`;
  for(let l=y+120;l<y+h-20;l+=70) o+=`<line x1="${x+10}" y1="${l}" x2="${x+w-10}" y2="${l}" stroke="#b9d3f0" stroke-width="3"/>`;
  o+=`<line x1="${x+110}" y1="${y+5}" x2="${x+110}" y2="${y+h-5}" stroke="#ef9a9a" stroke-width="4"/>`;
  for(let i=0;i<8;i++) o+=`<ellipse cx="${x}" cy="${y+50+i*66}" rx="22" ry="9" fill="none" stroke="#78909c" stroke-width="6"/>`;
  o+=`<text x="${x+140}" y="${y+100}" font-size="40" style="font-family:'Patrick Hand',cursive;fill:#5b6878">Objetivo:</text></g>`;
  o+=`<defs><clipPath id="write"><rect x="${x+130}" y="${y+150}" width="0" height="200"><animate attributeName="width" from="0" to="920" begin=".9s" dur="3.4s" fill="freeze"/></rect></clipPath></defs>`;
  o+=`<g clip-path="url(#write)"><text x="${x+140}" y="${y+238}" font-size="68" style="font-family:'Patrick Hand',cursive;fill:#1d4fb8">Construir e interpretar</text><text x="${x+140}" y="${y+238}" font-size="68" style="font-family:'Patrick Hand',cursive;fill:#1d4fb8;opacity:0">.</text></g>`;
  o+=`<defs><clipPath id="write2"><rect x="${x+130}" y="${y+290}" width="0" height="120"><animate attributeName="width" from="0" to="920" begin="4.3s" dur="2.4s" fill="freeze"/></rect></clipPath></defs>`;
  o+=`<g clip-path="url(#write2)"><text x="${x+140}" y="${y+378}" font-size="68" style="font-family:'Patrick Hand',cursive;fill:#1d4fb8">pictogramas.</text></g>`;
  o+=`<g><animateTransform attributeName="transform" type="translate" values="0 0;640 0;640 140;0 140;380 140;380 140" keyTimes="0;.47;.5;.53;.95;1" begin=".9s" dur="5.8s" fill="freeze"/>${sc(I.lapiz,x+180,y+200,2.2)}</g>`;
  o+=`<g class="rise" style="animation-delay:6.6s"><rect x="560" y="800" width="480" height="70" rx="35" fill="var(--accent)"/><text x="800" y="846" text-anchor="middle" font-size="34" font-weight="800" style="fill:#fff">Escríbelo en tu cuaderno</text></g>`;
  return o;
}
/* ---------- control ---------- */
let sit=0, step=0, lastScr=null;
const stage=document.getElementById('stage'), where=document.getElementById('where');
const tabs=document.getElementById('tabs');
{const b=document.createElement('button');b.textContent='Objetivo';b.onclick=()=>go(0,0);tabs.appendChild(b)}
SITS.forEach((S,k)=>{const b=document.createElement('button');b.textContent=`Situación ${k+1}`;b.title=S.t;b.onclick=()=>go(k,k===0?1:0);tabs.appendChild(b)});
function render(){
  const S=SITS[sit], st=S.steps[step], key=st.scr+(st.pi??''), fresh=key!==lastScr; lastScr=key;
  const body=st.scr==='obj'?objective():{comic,count,task,picto,story,end:ending}[st.scr](S,st,fresh);
  stage.innerHTML=`<defs><clipPath id="endclip"><rect x="36" y="106" width="1528" height="758" rx="14"/></clipPath></defs><rect width="1600" height="900" fill="var(--stage)"/>${st.scr==='obj'?'':title(sit,S)}${body}`;
  try{stage.setCurrentTime(0)}catch(e){}
  where.innerHTML=`<b>${LABEL[st.scr]}</b> · paso ${step+1} de ${S.steps.length}`;
  const cur=st.scr==='obj'?0:sit+1;[...tabs.children].forEach((b,k)=>b.setAttribute('aria-pressed',k===cur));
  document.getElementById('prev').disabled=document.getElementById('navL').disabled=sit===0&&step===0;
  document.getElementById('navR').disabled=sit===3&&step===S.steps.length-1;
  document.getElementById('next').textContent=step===S.steps.length-1?(sit<3?'Siguiente situación ▶':'Fin'):'Siguiente ▶';
  document.getElementById('next').disabled=sit===3&&step===S.steps.length-1;
}
function go(s,p){if(s!==sit)lastScr=null;sit=s;step=p;render()}
function next(){const n=SITS[sit].steps.length;if(step<n-1)go(sit,step+1);else if(sit<3)go(sit+1,0)}
const kk=t=>t.scr+(t.pi??'');
function prev(){if(step>0){lastScr=kk(SITS[sit].steps[step-1])===kk(SITS[sit].steps[step])?lastScr:null;step--;render()}else if(sit>0)go(sit-1,SITS[sit-1].steps.length-1)}
document.getElementById('next').onclick=next;
document.getElementById('prev').onclick=prev;
document.getElementById('navL').onclick=e=>{e.stopPropagation();prev()};
document.getElementById('navR').onclick=e=>{e.stopPropagation();next()};
stage.addEventListener('click',next);
window.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();next()}
  else if(['ArrowLeft','ArrowUp'].includes(e.key)){e.preventDefault();prev()}
  else if([' ','PageDown','Enter'].includes(e.key)&&e.target.tagName!=='BUTTON'){e.preventDefault();next()}
  else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();prev()}
  else if(['1','2','3','4'].includes(e.key))go(+e.key-1,e.key==='1'?1:0);
});
document.getElementById('fs').onclick=()=>{try{const el=document.documentElement;(document.fullscreenElement?document.exitFullscreen():el.requestFullscreen()).catch(()=>{})}catch(e){}};
render();
try{document.body.tabIndex=-1;window.focus();document.body.focus({preventScroll:true})}catch(e){}
stage.addEventListener('pointerdown',()=>{try{document.body.focus({preventScroll:true})}catch(e){}});
</script>
