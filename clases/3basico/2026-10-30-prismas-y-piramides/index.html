<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prismas y pirámides 3.º</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Atkinson+Hyperlegible:wght@400;700&family=Patrick+Hand&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: proyector a pantalla completa — barra superior, escenario central, controles abajo.
   Una sola apariencia clara a propósito (pensada para proyectar en sala). */
:root{
  --paper:#f4f8f6; --grid:#dfe9e4; --ink:#1d2a24; --muted:#5b6b63;
  --green:#3f6b4f; --green-soft:#e3eee7; --card:#ffffff;
  --base:#d64545; --base-soft:rgba(214,69,69,.18);
  --face:#2f6fd6; --face-soft:rgba(47,111,214,.18);
  --vertex:#16935a; --edge:#e3a400;
  --display:'Baloo 2', 'Trebuchet MS', system-ui, sans-serif;
  --body:'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif;
  --hand:'Patrick Hand', 'Comic Sans MS', cursive;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px;overflow:hidden}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;align-items:center;gap:12px;padding-block:10px;border-bottom:2px solid var(--grid)}
.brand{font-family:var(--display);font-weight:800;font-size:1.15rem;color:var(--green)}
.section{background:var(--green);color:#fff;border-radius:99px;padding:4px 14px;font-weight:700;font-size:.95rem}
.count{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
main{min-height:0;position:relative;padding-block:12px}
.slide{height:100%;display:flex;flex-direction:column;gap:14px;min-height:0}
footer{display:flex;align-items:center;gap:10px;padding-block:10px;border-top:2px solid var(--grid)}
button{font:inherit;cursor:pointer;border-radius:12px;border:2px solid var(--green);background:var(--card);color:var(--green);padding:8px 16px;font-weight:700}
button:focus-visible{outline:3px solid var(--edge);outline-offset:2px}
button.primary{background:var(--green);color:#fff}
.dots{display:flex;gap:6px;flex-wrap:wrap;flex:1;justify-content:center}
.dot{width:10px;height:10px;border-radius:50%;background:var(--grid)}
.dot.on{background:var(--green)}
.hint{color:var(--muted);font-size:.85rem}

h1,h2{font-family:var(--display);margin:0;line-height:1.05;text-wrap:balance}
h1{font-size:clamp(2.4rem,6vw,5rem);color:var(--green)}
h2{font-size:clamp(1.7rem,3.6vw,3rem)}
.lead{font-size:clamp(1.1rem,2.1vw,1.7rem);max-width:40ch;margin:0}
.big{font-size:clamp(1.1rem,2vw,1.6rem)}

[data-step]{opacity:0;transform:translateY(10px);transition:opacity .45s,transform .45s}
[data-step].on{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){[data-step],.piece{transition:none!important}}

.cover{justify-content:center;align-items:flex-start;padding-inline:4%}
.eyebrow{font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-size:.9rem}
.goal{background:var(--card);border:2px solid var(--green);border-radius:18px;padding:16px 22px;max-width:46ch}

.two{display:grid;grid-template-columns:1fr 1fr;gap:18px;flex:1;min-height:0}
.panel{background:var(--card);border-radius:20px;border:2px solid var(--grid);padding:14px 18px;display:flex;flex-direction:column;gap:8px;min-height:0;min-width:0}
.solid{flex:1;min-height:140px;display:flex;align-items:center;justify-content:center}
.solid svg{width:100%;height:100%;max-height:100%}
.tag{font-family:var(--display);font-size:clamp(1.3rem,2.6vw,2.2rem);color:var(--green)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--grid);border-radius:14px;padding:8px 14px;font-size:clamp(1rem,1.7vw,1.35rem)}
.sw{width:22px;height:22px;border-radius:6px;flex:none}
.rule{background:var(--green-soft);border-radius:16px;padding:12px 18px;font-size:clamp(1.05rem,1.9vw,1.5rem)}

.task{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;flex:1;align-items:center}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:14px;counter-reset:s}
.steps li{display:flex;gap:14px;align-items:flex-start;font-size:clamp(1.1rem,2.1vw,1.7rem);counter-increment:s}
.steps li::before{content:counter(s);flex:none;width:1.6em;height:1.6em;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.85em;margin-top:.1em}
.timer{background:var(--card);border:3px solid var(--green);border-radius:24px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:12px}
.time{font-family:var(--display);font-size:clamp(3.5rem,10vw,8rem);line-height:1;font-variant-numeric:tabular-nums;color:var(--green)}
.timer.done .time{color:var(--base);animation:blink .6s 6}
.timer .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
@keyframes blink{50%{opacity:.2}}

.sheet{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;flex:1;min-height:0;align-items:start}
.imgwrap{position:relative;height:100%;max-height:100%;aspect-ratio:1103/1426;max-width:100%;border-radius:10px;overflow:hidden;box-shadow:0 2px 0 var(--grid),0 0 0 2px var(--grid)}
.imgwrap img{width:100%;height:100%;display:block}
.ans{position:absolute;transform:translate(-50%,0);font-family:var(--hand);font-size:clamp(.9rem,2.1vh,1.6rem);line-height:1;white-space:nowrap;padding:1px 6px;border-radius:6px;background:rgba(255,255,255,.85)}
.ans.pr{color:var(--face)} .ans.pi{color:var(--base)}
.box{position:absolute;border:3px solid;border-radius:8px}
.box.b{border-color:var(--face);background:rgba(47,111,214,.12)}
.box.r{border-color:var(--base);background:rgba(214,69,69,.12)}
.box span{position:absolute;left:-3px;bottom:100%;font-size:clamp(.6rem,1.3vh,.9rem);font-weight:700;color:#fff;padding:1px 6px;border-radius:6px 6px 0 0;white-space:nowrap}
.box.b span{background:var(--face)} .box.r span{background:var(--base)}
.side{display:flex;flex-direction:column;gap:10px;min-width:0;overflow:auto;max-height:100%}
.found{display:flex;align-items:center;gap:10px;font-size:clamp(1rem,1.8vw,1.4rem)}
.tally{background:var(--card);border:2px solid var(--green);border-radius:16px;padding:12px 16px;font-size:clamp(1rem,1.7vw,1.3rem)}

.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;flex:1;min-height:0}
.grid4 .panel{align-items:center;text-align:center}
.legend{display:flex;gap:10px;flex-wrap:wrap}

.round{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;flex:1;min-height:0}
.board{background:var(--card);border-radius:20px;border:2px solid var(--grid);min-height:0;display:flex}
.board svg{width:100%;height:100%}
.piece polygon{fill:#fff8e1;stroke:var(--ink);stroke-width:3;stroke-linejoin:round;transition:fill .5s}
.piece{transition:transform 1.1s cubic-bezier(.3,.8,.3,1);transform-origin:0 0}
.piece.base polygon{fill:#f6c9c9}
.ghost{fill:none;stroke:var(--base);stroke-width:3;stroke-dasharray:10 8;opacity:0;transition:opacity .5s}
.ghost.on{opacity:1;animation:blink 1s infinite}
.round h2{font-size:clamp(1.3rem,2.5vw,2.2rem)}
.round .panel{overflow:auto}
.round .solid{min-height:170px}
.answer{font-family:var(--display);font-size:clamp(1.8rem,3.4vw,3rem);color:var(--green);line-height:1}

@media (max-width:760px){
  body{overflow:auto}
  .two,.task,.sheet,.round{grid-template-columns:1fr}
  .grid4{grid-template-columns:1fr 1fr}
  .imgwrap{height:auto;width:100%}
  .board{min-height:260px}
}
</style>
</head>
<body>


<div class="app">
  <header>
    <div class="brand">Prismas y pirámides</div>
    <div class="section" id="section">Inicio</div>
    <div class="count" id="count"></div>
  </header>
  <main id="stage"></main>
  <footer>
    <button id="prev" aria-label="Anterior">◀ Atrás</button>
    <div class="dots" id="dots"></div>
    <span class="hint">Flechas o espacio</span>
    <button id="fs">Pantalla completa</button>
    <button id="next" class="primary" aria-label="Siguiente">Siguiente ▶</button>
  </footer>
</div>

/* ---------- vector helpers ---------- */
const add=(a,b)=>[a[0]+b[0],a[1]+b[1]], sub=(a,b)=>[a[0]-b[0],a[1]-b[1]], mul=(a,k)=>[a[0]*k,a[1]*k];
const nrm=a=>{const l=Math.hypot(a[0],a[1]);return [a[0]/l,a[1]/l]};
const right=d=>[d[1],-d[0]];
const rot=(d,a)=>[d[0]*Math.cos(a)-d[1]*Math.sin(a),d[0]*Math.sin(a)+d[1]*Math.cos(a)];
const E=(P,i)=>[P[i],P[(i+1)%P.length]];
function rectAt(w,h){return [[0,0],[w,0],[w,h],[0,h]]}
function regPoly(k,side){const R=side/(2*Math.sin(Math.PI/k));const out=[];for(let i=0;i<k;i++){const a=-Math.PI/2-Math.PI/k+i*2*Math.PI/k;out.push([R*Math.cos(a),R*Math.sin(a)])}return out}
function attRect([p,q],h){const n=nrm(right(sub(q,p)));return [q,p,add(p,mul(n,h)),add(q,mul(n,h))]}
function attTri([p,q],h){const n=nrm(right(sub(q,p)));return [q,p,add(mul(add(p,q),.5),mul(n,h))]}
function attReg([p,q],k){const pts=[q,p];let d=sub(p,q);for(let i=0;i<k-2;i++){d=rot(d,2*Math.PI/k);pts.push(add(pts[pts.length-1],d))}return pts}

/* ---------- nets ---------- */
const B=pts=>({pts,base:true}), L=pts=>({pts});
const NETS={
  sqpyr(){const S=regPoly(4,1);return [B(S),...[0,1,2,3].map(i=>L(attTri(E(S,i),1.05)))]},
  triprism(){const R=rectAt(1,1.6);return [L(R),L(attRect(E(R,3),1)),L(attRect(E(R,1),1)),B(attTri(E(R,0),.866)),B(attTri(E(R,2),.866))]},
  cube(){const S=regPoly(4,1);const A=[0,1,2,3].map(i=>attReg(E(S,i),4));return [B(S),...A.map(L),B(attReg(E(A[0],2),4))]},
  tetra(){const T=regPoly(3,1);return [B(T),...[0,1,2].map(i=>L(attTri(E(T,i),.866)))]},
  rectprism(){const R=rectAt(1,1.8);const R2=attRect(E(R,1),1);return [L(R),L(attRect(E(R,3),1)),L(R2),L(attRect(E(R2,2),1)),B(attReg(E(R,0),4)),B(attReg(E(R,2),4))]},
  hexpyr(){const H=regPoly(6,1);return [B(H),...[0,1,2,3,4,5].map(i=>L(attTri(E(H,i),1.7)))]},
  pentprism(){const R=rectAt(1,1.5);const a=attRect(E(R,3),1),b=attRect(E(R,1),1);return [L(R),L(a),L(attRect(E(a,2),1)),L(b),L(attRect(E(b,2),1)),B(attReg(E(R,0),5)),B(attReg(E(R,2),5))]},
  trap(){const R=rectAt(1,1.6);return [L(R),L(attRect(E(R,3),1)),{pts:attRect(E(R,1),1),ghost:true},B(attTri(E(R,0),.866)),B(attTri(E(R,2),.866))]}
};
function rng(seed){let s=seed;return()=>((s=Math.imul(s^s>>>15,1|s)+0x6D2B79F5|0,(s>>>0)%10000)/10000)}

function mountNet(svg){
  const pieces=NETS[svg.dataset.net](), r=rng(+svg.dataset.seed||7);
  const all=pieces.flatMap(p=>p.pts), xs=all.map(p=>p[0]), ys=all.map(p=>p[1]);
  const [x0,x1,y0,y1]=[Math.min(...xs),Math.max(...xs),Math.min(...ys),Math.max(...ys)];
  const VW=1000,VH=620, s=Math.min(560/(x1-x0),540/(y1-y0));
  const T=p=>[VW/2+(p[0]-(x0+x1)/2)*s, VH/2-(p[1]-(y0+y1)/2)*s];
  svg.setAttribute('viewBox',`0 0 ${VW} ${VH}`);
  const real=pieces.filter(p=>!p.ghost), n=real.length, cols=Math.ceil(n/2), cw=VW/cols, ch=VH/2;
  const order=real.map((_,i)=>i).sort(()=>r()-.5);
  let html='';
  pieces.filter(p=>p.ghost).forEach(p=>{html+=`<polygon class="ghost" points="${p.pts.map(T).map(q=>q.join(',')).join(' ')}"/>`});
  real.forEach((p,i)=>{
    const sp=p.pts.map(T), c=sp.reduce((a,q)=>add(a,q),[0,0]).map(v=>v/sp.length);
    const loc=sp.map(q=>sub(q,c)).map(q=>q.map(v=>v.toFixed(1)).join(',')).join(' ');
    const cell=order[i], cx=(cell%cols+.5)*cw+(r()-.5)*cw*.25, cy=(Math.floor(cell/cols)+.5)*ch+(r()-.5)*ch*.2;
    const ang=Math.round((r()-.5)*140+[0,90,180][Math.floor(r()*3)]);
    html+=`<g class="piece${p.base?' isbase':''}" style="transition-delay:${i*70}ms" data-a="translate(${c[0].toFixed(1)}px,${c[1].toFixed(1)}px) rotate(0deg)" data-b="translate(${cx.toFixed(1)}px,${cy.toFixed(1)}px) rotate(${ang}deg)"><polygon points="${loc}"/></g>`;
  });
  svg.innerHTML=html;
}
function updateNet(svg,k){
  svg.querySelectorAll('.piece').forEach(g=>{g.style.transform=k>=1?g.dataset.a:g.dataset.b;g.classList.toggle('base',k>=2&&g.classList.contains('isbase'))});
  svg.querySelectorAll('.ghost').forEach(g=>g.classList.toggle('on',k>=1));
}

/* ---------- 3D solids ---------- */
function prism(k,side,h,lying){const R=side/(2*Math.sin(Math.PI/k)),v=[];for(const y of[-h/2,h/2])for(let i=0;i<k;i++){const a=i*2*Math.PI/k+Math.PI/k;v.push([R*Math.cos(a),y,R*Math.sin(a)])}
  const f=[{i:[...Array(k).keys()],base:1},{i:[...Array(k).keys()].map(x=>x+k),base:1}];
  for(let i=0;i<k;i++)f.push({i:[i,(i+1)%k,(i+1)%k+k,i+k]});
  return finish(v,f,lying,{vtx:k,edge:[0,k]})}
function pyramid(k,side,h){const R=side/(2*Math.sin(Math.PI/k)),v=[];for(let i=0;i<k;i++){const a=i*2*Math.PI/k+Math.PI/k;v.push([R*Math.cos(a),-h*.4,R*Math.sin(a)])}v.push([0,h*.6,0]);
  const f=[{i:[...Array(k).keys()],base:1}];for(let i=0;i<k;i++)f.push({i:[i,(i+1)%k,k]});
  return finish(v,f,false,{vtx:k,edge:[0,k]})}
function finish(v,f,lying,mark){
  if(lying)v=v.map(([x,y,z])=>[-y,x,z]);
  const lat=f.findIndex(x=>!x.base);
  return {v,f,lat,mark}}
const SOLIDS={
  sqpyr:()=>pyramid(4,1.2,1.3), triprism:()=>prism(3,1.1,1.5), cube:()=>prism(4,1.1,1.1), tetra:()=>pyramid(3,1.3,1.1),
  rectprism:()=>prism(4,1,1.7), hexpyr:()=>pyramid(6,.8,1.5), pentprism:()=>prism(5,.85,1.4),
  pentpyr:()=>pyramid(5,.9,1.4), trilying:()=>prism(3,1,2.1,true), hexprism:()=>prism(6,.75,1.4)
};
function render3D(S,th,opt){
  const phi=.42, P=([x,y,z])=>{const x1=x*Math.cos(th)+z*Math.sin(th), z1=-x*Math.sin(th)+z*Math.cos(th);

  const V=S.v.map(P), ctr=V.reduce((a,p)=>[a[0]+p[0],a[1]+p[1],a[2]+p[2]],[0,0,0]).map(x=>x/V.length);
  const R=Math.max(...S.v.map(p=>Math.hypot(...p)))*1.12;
  const faces=S.f.map((f,fi)=>{const p=f.i.map(i=>V[i]);const a=p[0],b=p[1],c=p[2];
    const u=[b[0]-a[0],b[1]-a[1],b[2]-a[2]],w=[c[0]-a[0],c[1]-a[1],c[2]-a[2]];
    let n=[u[1]*w[2]-u[2]*w[1],u[2]*w[0]-u[0]*w[2],u[0]*w[1]-u[1]*w[0]];
    const fc=p.reduce((s,q)=>[s[0]+q[0],s[1]+q[1],s[2]+q[2]],[0,0,0]).map(x=>x/p.length);
    if(n[0]*(fc[0]-ctr[0])+n[1]*(fc[1]-ctr[1])+n[2]*(fc[2]-ctr[2])<0)n=n.map(x=>-x);
    let col=null; if(opt.bases&&f.base)col='base'; if(opt.face&&fi===S.lat)col='face';
    return {pts:p,vis:n[2]>0,col}});
  const pstr=p=>p.map(q=>`${q[0].toFixed(3)},${(-q[1]).toFixed(3)}`).join(' ');
  const edges={};S.f.forEach((f,fi)=>f.i.forEach((a,j)=>{const b=f.i[(j+1)%f.i.length],key=a<b?a+'-'+b:b+'-'+a;(edges[key]=edges[key]||{a,b,f:[]}).f.push(fi)}));
  const C={base:['rgba(214,69,69,.85)','rgba(214,69,69,.3)'],face:['rgba(47,111,214,.85)','rgba(47,111,214,.3)']};
  let s='';
  faces.filter(f=>!f.vis&&f.col).forEach(f=>s+=`<polygon points="${pstr(f.pts)}" fill="${C[f.col][1]}" stroke="none"/>`);
  Object.values(edges).forEach(e=>{if(e.f.every(i=>!faces[i].vis))s+=`<line x1="${V[e.a][0]}" y1="${-V[e.a][1]}" x2="${V[e.b][0]}" y2="${-V[e.b][1]}" stroke="#7d8a84" stroke-width="2" stroke-dasharray="6 5" vector-effect="non-scaling-stroke"/>`});
  faces.filter(f=>f.vis).forEach(f=>s+=`<polygon points="${pstr(f.pts)}" fill="${f.col?C[f.col][0]:'rgba(255,255,255,.62)'}" stroke="none"/>`);
  Object.values(edges).forEach(e=>{if(e.f.some(i=>faces[i].vis))s+=`<line x1="${V[e.a][0]}" y1="${-V[e.a][1]}" x2="${V[e.b][0]}" y2="${-V[e.b][1]}" stroke="#1d2a24" stroke-width="3" stroke-linecap="round" vector-effect="non-scaling-stroke"/>`});
  if(opt.edge){const [a,b]=S.mark.edge;s+=`<line x1="${V[a][0]}" y1="${-V[a][1]}" x2="${V[b][0]}" y2="${-V[b][1]}" stroke="#e3a400" stroke-width="9" stroke-linecap="round" vector-effect="non-scaling-stroke" opacity=".95"/>`}
  if(opt.vertex){const p=V[S.mark.vtx];s+=`<circle cx="${p[0]}" cy="${-p[1]}" r="${R*.075}" fill="#16935a" stroke="#fff" stroke-width="3" vector-effect="non-scaling-stroke"/>`}
  return `<svg viewBox="${-R} ${-R} ${2*R} ${2*R}" role="img">${s}</svg>`;
}
const views=[];
function mountSolid(el){views.push({el,S:SOLIDS[el.dataset.solid](),th:+(el.dataset.th||0.6),opt:{},spin:el.dataset.spin!=='0'})}
function setSolidOpts(el,k){const v=views.find(v=>v.el===el);if(!v)return;const hl=Object.fromEntries((el.dataset.hl||'').split(',').filter(Boolean).map(x=>x.split(':')));
  v.opt={};for(const key in hl)v.opt[key]=k>=+hl[key];v.el.innerHTML=render3D(v.S,v.th,v.opt)}
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
let last=performance.now();
function loop(t){const dt=(t-last)/1000;last=t;views.forEach(v=>{if(v.spin&&!still&&v.el.isConnected){v.th+=dt*.45;v.el.innerHTML=render3D(v.S,v.th,v.opt)}});requestAnimationFrame(loop)}
requestAnimationFrame(loop);

/* ---------- timer ---------- */
const timers={};let actx=null;
function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();[0,.35,.7].forEach(d=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.2,actx.currentTime+d);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d+.3);o.start(actx.currentTime+d);o.stop(actx.currentTime+d+.32)})}catch(e){}}
function mountTimer(el,id){const t=timers[id]=timers[id]||{total:+el.dataset.min*60,left:+el.dataset.min*60,run:false};
  el.innerHTML=`<div class="time" aria-live="polite"></div><div class="row"><button data-a="-">− 1 min</button><button data-a="go" class="primary"></button><button data-a="+">+ 1 min</button><button data-a="r">Reiniciar</button></div>`;
  const draw=()=>{const m=Math.floor(t.left/60),s=t.left%60;el.querySelector('.time').textContent=`${m}:${String(s).padStart(2,'0')}`;el.querySelector('[data-a=go]').textContent=t.run?'Pausar':'Iniciar';el.classList.toggle('done',t.left===0)};
  el.onclick=e=>{const a=e.target.dataset.a;if(!a)return;e.stopPropagation();
    if(a==='go'){if(!actx)try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(_){};if(t.left===0)t.left=t.total;t.run=!t.run}
    if(a==='+'){t.total+=60;t.left+=60} if(a==='-'&&t.left>60){t.total-=60;t.left-=60} if(a==='r'){t.run=false;t.left=t.total} draw()};
  t.draw=draw;draw()}
setInterval(()=>{for(const id in timers){const t=timers[id];if(t.run&&t.left>0){t.left--;if(t.left===0){t.run=false;beep()}t.draw&&t.draw()}}},1000);

/* ---------- navigation ---------- */
const stage=document.getElementById('stage');let S=0,K=0;
function mount(){
  views.length=0;const sl=SL[S];
  stage.innerHTML=`<section class="slide ${sl.cls||''}">${sl.html}</section>`;
  stage.querySelectorAll('.solid').forEach(mountSolid);
  stage.querySelectorAll('svg.net').forEach(mountNet);
  stage.querySelectorAll('.timer').forEach(el=>mountTimer(el,'t'+S));
  document.getElementById('section').textContent=sl.sec;
  document.getElementById('dots').innerHTML=SL.map((_,i)=>`<span class="dot${i<=S?' on':''}"></span>`).join('');
  update(true);
}
function update(instant){
  const sl=SL[S];
  stage.querySelectorAll('[data-step]').forEach(el=>el.classList.toggle('on',K>=+el.dataset.step));
  stage.querySelectorAll('[data-until]').forEach(el=>{el.hidden=K>+el.dataset.until});
  stage.querySelectorAll('.solid').forEach(el=>setSolidOpts(el,K));
  stage.querySelectorAll('svg.net').forEach(svg=>{
    if(instant){svg.querySelectorAll('.piece').forEach(g=>{g.style.transition='none'});updateNet(svg,K);svg.getBoundingClientRect();
      requestAnimationFrame(()=>svg.querySelectorAll('.piece').forEach(g=>{g.style.transition=''}))}
    else updateNet(svg,K)});
  document.getElementById('count').textContent=`${S+1} / ${SL.length}`+(sl.steps?` · paso ${K}/${sl.steps}`:'');
}
function next(){if(K<SL[S].steps){K++;update()}else if(S<SL.length-1){S++;K=0;mount()}}
function prev(){if(K>0){K--;update()}else if(S>0){S--;K=SL[S].steps;mount()}}
document.getElementById('next').onclick=next;
document.getElementById('prev').onclick=prev;
document.getElementById('fs').onclick=()=>{const d=document.documentElement;(document.fullscreenElement?document.exitFullscreen():d.requestFullscreen?.())?.catch?.(()=>{})};
addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)){if(e.target.tagName==='BUTTON'&&e.key!=='ArrowRight')return;e.preventDefault();next()}
  if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();prev()}});
mount();
</script>
